<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>M17 Training</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--line:#2b3440;--text:#f4f6f8;--muted:#9ea9b7;--accent:#f1c40f;--ok:#2ecc71;--bad:#ff6b6b;--info:#5dade2}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif} main{max-width:900px;margin:auto;padding:16px 14px 80px}
    h1{font-size:30px;line-height:1.05;margin:8px 0} h2{font-size:21px;margin:0 0 12px} h3{font-size:16px;margin:0 0 8px} p{color:var(--muted);line-height:1.45}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--accent);font-weight:800}
    .panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.card{background:var(--panel2);margin:8px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}
    .nav{display:flex;gap:7px;overflow:auto;padding:8px 0 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:4}.nav button,.pill{white-space:nowrap;background:#202833;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 12px}.nav button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}
    button{font:inherit;cursor:pointer}.primary,.secondary,.danger{width:100%;padding:14px;border-radius:13px;font-weight:800;margin-top:10px}.primary{background:var(--accent);color:#111;border:0}.secondary{background:#252e39;color:#fff;border:1px solid #3a4655}.danger{background:#3a1e22;color:#ffb6bd;border:1px solid #5b2b32}
    label{display:block;color:#cfd6df;font-size:13px;margin:10px 0}input,select,textarea{width:100%;background:#0f141b;color:#fff;border:1px solid #354150;border-radius:12px;padding:12px;margin-top:5px;font:inherit}textarea{min-height:84px;resize:vertical}.formgrid,.goalgrid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goal{background:#1a212b;color:white;border:1px solid #303b49;border-radius:15px;padding:14px;text-align:left}.goal.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.goal span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
    .checks{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #343f4e;padding:8px 10px;border-radius:999px;font-size:12px}.chip input{width:auto;margin:0 5px 0 0}.stat{background:#10161d;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{display:block;font-size:25px}.stat small{color:var(--muted)}
    .badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#26303c}.NEW{background:#473c13;color:#ffe58a}.ACTIVE{background:#163a29;color:#92f0ba}.ASSESSMENT{background:#17344c;color:#9cd5ff}.PAUSED,.ARCHIVE{color:#aeb8c4}.alert{border-left:4px solid var(--bad);padding-left:10px;color:#ffc1c1}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}.clientCard{cursor:pointer}.block{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}.block small{display:block;color:var(--muted);max-width:600px}.programBox{border-left:4px solid var(--accent);padding-left:12px}.ok{color:#8ef0b6}.error{color:#ffaaaa}.sectionTitle{margin-top:22px}.back{background:none;border:0;color:#fff;padding:4px 0 10px}.statusButtons{display:flex;gap:6px;flex-wrap:wrap}.statusButtons button{width:auto;margin:0;padding:8px 10px}.log{border-top:1px solid var(--line);padding:10px 0}.log b{font-size:13px}.kicker{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    @media(max-width:620px){.formgrid,.goalgrid,.stats{grid-template-columns:1fr}h1{font-size:27px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">M17 TRAINING · v0.3</div>
  <h1 id="title">Загрузка…</h1>
  <p id="subtitle">Определяем кабинет.</p>
  <div id="nav" class="nav hidden"></div>
  <div id="app"></div>
</main>
<script>
const tg=window.Telegram?.WebApp; tg?.ready?.(); tg?.expand?.();
const initData=tg?.initData||''; const tgUser=tg?.initDataUnsafe?.user||{};
const $=s=>document.querySelector(s); const app=$('#app');
const authHeaders=()=> initData?{'X-Telegram-Init-Data':initData}:{};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...authHeaders()};if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';const r=await fetch(url,opt);if(!r.ok){let d={};try{d=await r.json()}catch{};throw new Error(d.detail||`HTTP ${r.status}`)}return r.status===204?null:r.json()}
const goalNames={ironman:'Ironman 140.6',half_ironman:'Ironman 70.3',olympic:'Олимпийка',sprint:'Спринт',crossfit:'CrossFit',fat_loss:'Похудение',muscle_gain:'Набор мышц'};
const statusNames={NEW:'Новый',ASSESSMENT:'Тестирование',ACTIVE:'Активен',PAUSED:'Пауза',REHAB:'Rehab',COMPLETED:'Завершил',ARCHIVE:'Архив'};
let me=null, currentClient=null;
function setHeader(title,sub){$('#title').textContent=title;$('#subtitle').textContent=sub||''}
function nav(items,active){const n=$('#nav');n.classList.remove('hidden');n.innerHTML=items.map(([id,t])=>`<button data-id="${id}" class="${id===active?'active':''}">${t}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>route(b.dataset.id))}
function esc(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){if(!s)return'—';return String(s).slice(0,10)}
function spinner(){app.innerHTML='<div class="panel"><p>Загрузка…</p></div>'}
function errorBox(e){app.innerHTML=`<div class="panel"><h2>Не удалось открыть</h2><p class="error">${esc(e.message)}</p><p>Откройте M17 кнопкой внутри Telegram. Если ошибка повторяется — сообщите тренеру.</p></div>`}

async function start(){try{me=await api('/auth/me');if(me.is_coach){setHeader('M17 Coach','Ваш кабинет тренера');route('coachDashboard')}else{setHeader('M17 Athlete','Личный кабинет клиента');route('clientHome')}}catch(e){errorBox(e)}}
function route(name){if(me?.is_coach){const items=[['coachDashboard','Обзор'],['coachClients','Клиенты'],['coachNew','Новые']];nav(items,name);if(name==='coachDashboard')coachDashboard();if(name==='coachClients')coachClients();if(name==='coachNew')coachClients('NEW');}else{const items=[['clientHome','Сегодня'],['clientProgram','Программа'],['clientProgress','Прогресс'],['clientProfile','Профиль']];nav(items,name);if(name==='clientHome')clientHome();if(name==='clientProgram')clientProgram();if(name==='clientProgress')clientProgress();if(name==='clientProfile')clientProfile();}}

async function coachDashboard(){spinner();try{const d=await api('/coach/dashboard');app.innerHTML=`<div class="stats"><div class="stat"><b>${d.clients}</b><small>клиентов</small></div><div class="stat"><b>${d.active_clients}</b><small>активных</small></div><div class="stat"><b>${d.new_clients}</b><small>новых анкет</small></div><div class="stat"><b>${d.alerts_count}</b><small>требуют внимания</small></div></div><div class="panel"><h2>Требуют внимания</h2>${d.alerts.length?d.alerts.map(a=>`<div class="log clientCard" data-id="${a.client_id}"><b>${esc(a.name)}</b><div class="alert small">${esc(a.message)}</div></div>`).join(''):'<p>Сейчас критических сигналов нет.</p>'}</div><div class="panel"><h2>Что дальше</h2><p>Новые анкеты сначала проверяются вами. После проверки можно перевести клиента в тестирование или активировать базовую программу.</p><button class="primary" onclick="route('coachNew')">Открыть новые анкеты</button></div>`;bindClientCards()}catch(e){errorBox(e)}}

async function coachClients(status=''){spinner();try{const rows=await api('/coach/clients'+(status?`?status=${status}`:''));app.innerHTML=`<div class="panel"><div class="row"><h2>${status==='NEW'?'Новые клиенты':'Все клиенты'}</h2><span class="pill">${rows.length}</span></div>${rows.length?rows.map(c=>`<div class="card clientCard" data-id="${c.telegram_user_id}"><div class="row"><div><b>${esc(c.name)}</b><div class="small muted">${goalNames[c.goal]||c.goal} · ${esc(c.level)} · стаж ${c.experience_years} г.</div></div><span class="badge ${c.status}">${statusNames[c.status]||c.status}</span></div>${c.program?`<div class="small muted">Программа: ${esc(c.program.title)} · ${esc(c.program.phase)}</div>`:'<div class="small muted">Программа ещё не назначена</div>'}${c.alert?`<div class="alert small">${esc(c.alert)}</div>`:''}</div>`).join(''):'<p>Здесь пока пусто.</p>'}</div>`;bindClientCards()}catch(e){errorBox(e)}}
function bindClientCards(){document.querySelectorAll('.clientCard').forEach(x=>x.onclick=()=>coachClient(x.dataset.id))}

async function coachClient(id){currentClient=id;$('#nav').classList.add('hidden');spinner();try{const d=await api('/coach/clients/'+encodeURIComponent(id));const p=d.profile;setHeader(p.name,`${goalNames[p.primary_goal]||p.primary_goal} · ${statusNames[p.status]||p.status}`);app.innerHTML=`<button class="back" id="backClients">← Назад к клиентам</button><div class="panel"><div class="row wrap"><div><div class="kicker">Профиль</div><h2>${esc(p.name)}</h2><div class="muted">${p.age} лет · ${p.weight_kg||'—'} кг · ${p.height_cm||'—'} см · стаж ${p.experience_years} лет</div></div><span class="badge ${p.status}">${statusNames[p.status]||p.status}</span></div>${d.alert?`<p class="alert">${esc(d.alert)}</p>`:''}<div class="stats"><div class="stat"><b>${p.days_per_week}</b><small>дней / нед.</small></div><div class="stat"><b>${p.hours_per_week}</b><small>часов / нед.</small></div><div class="stat"><b>${p.weeks_to_event||'—'}</b><small>недель до старта</small></div><div class="stat"><b>${d.programs.length}</b><small>циклов в базе</small></div></div><h3 class="sectionTitle">Статус клиента</h3><div class="statusButtons">${['NEW','ASSESSMENT','ACTIVE','PAUSED','REHAB','COMPLETED','ARCHIVE'].map(s=>`<button class="secondary statusBtn" data-status="${s}">${statusNames[s]}</button>`).join('')}</div><h3 class="sectionTitle">Заметки тренера</h3><textarea id="coachNotes" placeholder="Ваши заметки">${esc(p.coach_notes||'')}</textarea><button id="saveNotes" class="secondary">Сохранить заметки</button></div><div class="panel"><h2>Программа</h2>${d.programs.length?renderPlan(d.programs[0].plan,d.programs[0].title):'<p>Активная программа ещё не назначена.</p>'}<button id="makeProgram" class="primary">Создать / активировать базовый цикл</button><p class="small muted">Пока это каркас по цели. После анализа ваших реальных программ здесь появятся микроциклы и конкретные тренировки.</p></div><div class="panel"><h2>Последние отчёты</h2>${d.logs.length?d.logs.slice(0,10).map(renderLog).join(''):'<p>Отчётов пока нет.</p>'}</div><div class="panel"><h2>Показатели</h2>${d.metrics.length?d.metrics.slice(0,12).map(m=>`<div class="log"><b>${esc(m.metric_type)}</b> — ${m.value} ${esc(m.unit||'')}<div class="small muted">${fmtDate(m.measured_at)} ${m.note?'· '+esc(m.note):''}</div></div>`).join(''):'<p>Замеров пока нет.</p>'}</div>`;
$('#backClients').onclick=()=>{setHeader('M17 Coach','Ваш кабинет тренера');route('coachClients')};document.querySelectorAll('.statusBtn').forEach(b=>b.onclick=async()=>{await api(`/coach/clients/${id}/status`,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});coachClient(id)});$('#saveNotes').onclick=async()=>{await api(`/coach/clients/${id}/notes`,{method:'PATCH',body:JSON.stringify({coach_notes:$('#coachNotes').value})});tg?.HapticFeedback?.notificationOccurred?.('success')};$('#makeProgram').onclick=async()=>{if(!confirm('Создать и активировать базовую структуру программы для клиента?'))return;await api(`/coach/clients/${id}/program`,{method:'POST',body:JSON.stringify({activate:true})});coachClient(id)}
}catch(e){errorBox(e)}}
function renderPlan(plan,title=''){if(!plan)return'';return `<div class="programBox"><b>${esc(title||goalNames[plan.goal]||plan.goal)}</b><div class="small muted">Фаза: ${esc(plan.phase)} · ${plan.total_sessions} сессий</div>${(plan.blocks||[]).map(b=>`<div class="block"><div><strong>${esc(b.name)}</strong><small>${esc(b.note)}</small></div><b>${b.sessions}×</b></div>`).join('')}${plan.profile_note?`<p class="small">${esc(plan.profile_note)}</p>`:''}${plan.warning?`<p class="alert small">${esc(plan.warning)}</p>`:''}</div>`}
function renderLog(l){return `<div class="log"><div class="row"><b>${esc(l.workout_name)}</b><span>${l.completed?'✅':'❌'}</span></div><div class="small muted">${fmtDate(l.workout_date)} ${l.rpe?'· RPE '+l.rpe:''} ${l.wellbeing?'· самочувствие '+l.wellbeing+'/5':''} ${l.pain?'· ⚠️ боль':''}</div>${l.comment?`<div class="small">${esc(l.comment)}</div>`:''}</div>`}

async function clientHome(){spinner();try{const d=await api('/client/home');if(!d.has_profile){return showOnboarding()}const p=d.profile;app.innerHTML=`<div class="panel"><div class="kicker">Сегодня</div><h2>${esc(p.name)}, ваш статус: ${statusNames[p.status]||p.status}</h2>${p.status==='NEW'?'<p>Анкета получена. Тренер проверит данные и назначит следующий шаг.</p>':p.status==='ASSESSMENT'?'<p>Сейчас этап тестирования. После него тренер подтвердит тренировочный цикл.</p>':'<p>Отмечайте выполненные тренировки и самочувствие — эти данные видит тренер.</p>'}${d.program?renderPlan(d.program.plan,d.program.title):'<div class="card">Программа ожидает назначения тренером.</div>'}</div><div class="panel"><h2>Отчёт после тренировки</h2><div class="formgrid"><label>Название<input id="wName" value="Тренировка" /></label><label>Дата<input id="wDate" type="date" value="${new Date().toISOString().slice(0,10)}" /></label><label>RPE 1–10<input id="wRpe" type="number" min="1" max="10" /></label><label>Самочувствие 1–5<input id="wWell" type="number" min="1" max="5" /></label><label>Длительность, мин<input id="wDur" type="number" min="0" /></label><label class="chip"><input id="wPain" type="checkbox"> Есть боль / дискомфорт</label></div><label>Комментарий<textarea id="wComment"></textarea></label><button id="sendLog" class="primary">Отправить тренеру</button><div id="logStatus" class="small muted"></div></div>`;$('#sendLog').onclick=sendWorkoutLog}catch(e){errorBox(e)}}
async function sendWorkoutLog(){try{await api('/client/workout-log',{method:'POST',body:JSON.stringify({workout_date:$('#wDate').value,workout_name:$('#wName').value||'Тренировка',completed:true,rpe:$('#wRpe').value?+$('#wRpe').value:null,wellbeing:$('#wWell').value?+$('#wWell').value:null,pain:$('#wPain').checked,duration_min:$('#wDur').value?+$('#wDur').value:null,comment:$('#wComment').value||null})});$('#logStatus').innerHTML='<span class="ok">Отчёт отправлен.</span>';tg?.HapticFeedback?.notificationOccurred?.('success')}catch(e){$('#logStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
async function clientProgram(){spinner();try{const d=await api('/client/home');app.innerHTML=`<div class="panel"><h2>Моя программа</h2>${d.has_profile&&d.program?renderPlan(d.program.plan,d.program.title):'<p>Программа ещё не назначена тренером.</p>'}</div>`}catch(e){errorBox(e)}}
async function clientProgress(){spinner();try{const d=await api('/client/home');app.innerHTML=`<div class="panel"><h2>Добавить показатель</h2><div class="formgrid"><label>Показатель<select id="metricType"><option value="weight">Вес</option><option value="waist">Талия</option><option value="ftp">FTP</option><option value="run_5k">Бег 5 км</option><option value="swim_css">CSS плавание</option><option value="back_squat">Back Squat</option><option value="deadlift">Deadlift</option><option value="snatch">Snatch</option><option value="clean_jerk">Clean & Jerk</option></select></label><label>Значение<input id="metricValue" type="number" step="0.01" /></label><label>Единица<input id="metricUnit" placeholder="кг, Вт, сек/100м…" /></label><label>Комментарий<input id="metricNote" /></label></div><button id="addMetric" class="primary">Сохранить показатель</button></div><div class="panel"><h2>История</h2>${d.metrics?.length?d.metrics.map(m=>`<div class="log"><b>${esc(m.metric_type)}</b> — ${m.value} ${esc(m.unit||'')}<div class="small muted">${fmtDate(m.measured_at)}</div></div>`).join(''):'<p>Показателей пока нет.</p>'}</div>`;$('#addMetric').onclick=async()=>{if(!$('#metricValue').value)return;await api('/client/progress',{method:'POST',body:JSON.stringify({metric_type:$('#metricType').value,value:+$('#metricValue').value,unit:$('#metricUnit').value,note:$('#metricNote').value||null})});clientProgress()}}catch(e){errorBox(e)}}
async function clientProfile(){spinner();try{const d=await api('/client/home');if(!d.has_profile)return showOnboarding();renderProfileForm(d.profile)}catch(e){errorBox(e)}}

const goals=[['ironman','Ironman 140.6','Длинная дистанция'],['half_ironman','Ironman 70.3','Половинная дистанция'],['olympic','Олимпийка','1.5 / 40 / 10 км'],['sprint','Спринт','Короткая дистанция'],['crossfit','CrossFit','Functional Fitness'],['fat_loss','Похудение','Снижение жировой массы'],['muscle_gain','Набор мышц','Гипертрофия + сила']];
const equipment=['Тренажёрный зал','Штанга/стойки','Гири/гантели','CrossFit box','Бассейн','Велосипед','Велостанок','Беговая дорожка','Гребля','SkiErg'];
function showOnboarding(){setHeader('Новый клиент','Заполните анкету — она попадёт тренеру');renderProfileForm(null,true)}
function renderProfileForm(p=null,isNew=false){let goal=p?.primary_goal||'ironman';app.innerHTML=`<div class="panel"><h2>${isNew?'Анкета нового клиента':'Мой профиль'}</h2><div class="formgrid"><label>Имя<input id="pName" value="${esc(p?.name||tgUser.first_name||'')}" /></label><label>Пол<select id="pSex"><option value="not_specified">Не указан</option><option value="male">Мужчина</option><option value="female">Женщина</option><option value="other">Другое</option></select></label><label>Возраст<input id="pAge" type="number" min="14" max="90" value="${p?.age||35}" /></label><label>Стаж, лет<input id="pExp" type="number" min="0" max="60" step="0.5" value="${p?.experience_years??1}" /></label><label>Рост, см<input id="pHeight" type="number" value="${p?.height_cm||''}" /></label><label>Вес, кг<input id="pWeight" type="number" step="0.1" value="${p?.weight_kg||''}" /></label></div><h3 class="sectionTitle">Цель</h3><div id="goalGrid" class="goalgrid"></div><div class="formgrid"><label>Уровень<select id="pLevel"><option value="beginner">Начинающий</option><option value="intermediate">Средний</option><option value="advanced">Продвинутый</option><option value="competitive">Соревновательный</option></select></label><label>Дней в неделю<input id="pDays" type="number" min="2" max="7" value="${p?.days_per_week||5}" /></label><label>Часов в неделю<input id="pHours" type="number" min="2" max="30" step="0.5" value="${p?.hours_per_week||8}" /></label><label>Недель до старта<input id="pWeeks" type="number" min="1" max="104" value="${p?.weeks_to_event||24}" /></label></div><h3 class="sectionTitle">Оборудование</h3><div id="eqChecks" class="checks"></div><label>Ограничения<textarea id="pLimits">${esc(p?.limitations||'')}</textarea></label><label>Комментарий тренеру<textarea id="pNotes">${esc(p?.notes||'')}</textarea></label><button id="saveProfile" class="primary">${isNew?'Отправить анкету тренеру':'Сохранить изменения'}</button><div id="savePStatus" class="small muted"></div></div>`;
if(p?.sex)$('#pSex').value=p.sex;if(p?.level)$('#pLevel').value=p.level;
function drawGoals(){$('#goalGrid').innerHTML=goals.map(g=>`<button class="goal ${g[0]===goal?'selected':''}" data-g="${g[0]}"><b>${g[1]}</b><span>${g[2]}</span></button>`).join('');document.querySelectorAll('.goal').forEach(b=>b.onclick=()=>{goal=b.dataset.g;drawGoals()})}drawGoals();
$('#eqChecks').innerHTML=equipment.map((e,i)=>`<label class="chip"><input type="checkbox" value="${e}" ${(p?.equipment||[]).includes(e)?'checked':''}>${e}</label>`).join('');
$('#saveProfile').onclick=async()=>{const payload={telegram_user_id:String(tgUser.id||'unknown'),telegram_username:tgUser.username||null,name:$('#pName').value.trim()||tgUser.first_name||'Клиент',sex:$('#pSex').value,age:+$('#pAge').value,height_cm:$('#pHeight').value?+$('#pHeight').value:null,weight_kg:$('#pWeight').value?+$('#pWeight').value:null,experience_years:+$('#pExp').value||0,primary_goal:goal,level:$('#pLevel').value,days_per_week:+$('#pDays').value,hours_per_week:+$('#pHours').value,weeks_to_event:$('#pWeeks').value?+$('#pWeeks').value:null,equipment:[...document.querySelectorAll('#eqChecks input:checked')].map(x=>x.value),limitations:$('#pLimits').value||null,notes:$('#pNotes').value||null};try{await api('/clients/profile',{method:'POST',body:JSON.stringify(payload)});$('#savePStatus').innerHTML='<span class="ok">Сохранено. Анкета доступна тренеру.</span>';setTimeout(()=>{setHeader('M17 Athlete','Личный кабинет клиента');route('clientHome')},700)}catch(e){$('#savePStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}}}

start();
</script></body></html>
