<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>M17 Training</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--line:#2b3440;--text:#f4f6f8;--muted:#9ea9b7;--accent:#f1c40f;--ok:#2ecc71;--bad:#ff6b6b;--info:#5dade2;--warn:#f5b041}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:920px;margin:auto;padding:16px 14px 90px}h1{font-size:30px;line-height:1.05;margin:8px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{color:var(--muted);line-height:1.45}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--accent);font-weight:800}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.card{background:var(--panel2);margin:8px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.modeSwitch{display:flex;gap:7px;margin:10px 0 4px}.modeSwitch button{flex:1;padding:11px;border-radius:13px;border:1px solid var(--line);background:#202833;color:var(--text);font-weight:800}.modeSwitch button.active{background:var(--accent);color:#111;border-color:var(--accent)}.nav{display:flex;gap:7px;overflow:auto;padding:8px 0 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:4}.nav button,.pill{white-space:nowrap;background:#202833;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 12px}.nav button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}button{font:inherit;cursor:pointer}.primary,.secondary,.danger,.mini{width:100%;padding:14px;border-radius:13px;font-weight:800;margin-top:10px}.primary{background:var(--accent);color:#111;border:0}.secondary{background:#252e39;color:#fff;border:1px solid #3a4655}.danger{background:#3a1e22;color:#ffb6bd;border:1px solid #5b2b32}.mini{width:auto;padding:8px 10px;margin:0;background:#252e39;color:#fff;border:1px solid #3a4655}label{display:block;color:#cfd6df;font-size:13px;margin:10px 0}input,select,textarea{width:100%;background:#0f141b;color:#fff;border:1px solid #354150;border-radius:12px;padding:12px;margin-top:5px;font:inherit}textarea{min-height:100px;resize:vertical}.formgrid,.goalgrid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goal{background:#1a212b;color:white;border:1px solid #303b49;border-radius:15px;padding:14px;text-align:left}.goal.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.goal span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.checks{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #343f4e;padding:8px 10px;border-radius:999px;font-size:12px}.chip input{width:auto;margin:0 5px 0 0}.stat{background:#10161d;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{display:block;font-size:25px}.stat small{color:var(--muted)}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#26303c}.WAITING_APPROVAL,.NEW{background:#473c13;color:#ffe58a}.ACTIVE{background:#163a29;color:#92f0ba}.ASSESSMENT{background:#17344c;color:#9cd5ff}.PAYMENT_DUE{background:#4a3314;color:#ffd98b}.SUSPENDED{background:#4b2026;color:#ffb4bd}.PAUSED,.ARCHIVE{color:#aeb8c4}.alert{border-left:4px solid var(--bad);padding-left:10px;color:#ffc1c1}.warn{border-left:4px solid var(--warn);padding-left:10px;color:#ffe1aa}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}.clientCard{cursor:pointer}.block{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}.block small{display:block;color:var(--muted);max-width:600px}.programBox{border-left:4px solid var(--accent);padding-left:12px}.ok{color:#8ef0b6}.error{color:#ffaaaa}.sectionTitle{margin-top:22px}.back{background:none;border:0;color:#fff;padding:4px 0 10px}.statusButtons{display:flex;gap:6px;flex-wrap:wrap}.statusButtons button{width:auto;margin:0;padding:8px 10px}.log{border-top:1px solid var(--line);padding:10px 0}.log b{font-size:13px}.kicker{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.workout{border-left:4px solid var(--info)}.workout.done{border-left-color:var(--ok)}.workout.partial{border-left-color:var(--warn)}.locked{text-align:center;padding:22px}.pre{white-space:pre-wrap;line-height:1.55;color:#e8edf3;background:#10161d;border-radius:12px;padding:13px;border:1px solid var(--line)}.priorityBox{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:end}.focusTitle{margin:14px 0 6px}.accessGood{color:#8ef0b6}.accessBad{color:#ffb1b1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}.modalBox{background:#151b23;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px;width:min(720px,100%);max-height:88vh;overflow:auto}.rangeRow{display:flex;align-items:center;gap:10px}.rangeRow input{flex:1}.score{font-size:24px;font-weight:800;min-width:35px;text-align:center}.sep{height:1px;background:var(--line);margin:14px 0}.metricStrip{display:flex;gap:7px;overflow:auto;padding:7px 0 2px;scrollbar-width:none}.metricStrip::-webkit-scrollbar{display:none}.metricPill{white-space:nowrap;background:#10161d;border:1px solid #33404f;border-radius:999px;padding:7px 9px;font-size:11px;color:#dbe3ec}.metricPill b{color:#fff}.metricPill.pending{border-color:#6b5a20;color:#ffe59b}.metricGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metricInput{background:#10161d;border:1px solid var(--line);border-radius:13px;padding:10px}.metricInput label{margin:0}.metricGroup{margin:16px 0 6px;color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.testingCard{border-left:4px solid var(--warn)}.cycleCard{cursor:pointer;border-left:4px solid var(--accent)}.weekGroup{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}.tag{display:inline-block;border:1px solid #3a4655;border-radius:999px;padding:4px 7px;margin:2px;font-size:10px;color:#cfd6df}.importBox{border-left:4px solid var(--info)}.libraryMeta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.twoActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.twoActions button{margin-top:0}.fileLabel{border:1px dashed #465568;border-radius:13px;padding:14px}.fileLabel input{margin-top:8px}.visualGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.visualFrame{background:#0f141b;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:160px;display:flex;align-items:center;justify-content:center}.visualFrame img{display:block;width:100%;height:240px;object-fit:contain;background:#fff}.visualEmpty{padding:28px 12px;text-align:center;color:var(--muted)}.visualOk{color:#8ef0b6}.visualNeed{color:#ffe1aa}@media(max-width:620px){.visualGrid{grid-template-columns:1fr}.visualFrame img{height:auto;max-height:420px}}
.techList{margin-top:14px}.techItem{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#10161d;border:1px solid var(--line);border-radius:13px;padding:10px;margin:7px 0}.techItem button{margin:0;white-space:nowrap}.techMeta{min-width:0}.techMeta b{display:block}.techMeta span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.techVisuals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.techVisuals img{width:100%;max-height:360px;object-fit:contain;background:#fff;border-radius:14px;border:1px solid var(--line)}.linkReport{margin-top:12px}.unmatchedLine{border-left:3px solid var(--warn)}@media(max-width:620px){.techItem{align-items:flex-start;flex-direction:column}.techItem button{width:100%}.techVisuals{grid-template-columns:1fr}}
    @media(max-width:620px){.formgrid,.goalgrid,.stats{grid-template-columns:1fr}h1{font-size:27px}.priorityBox{grid-template-columns:1fr 90px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">M17 TRAINING · v0.6.8</div>
  <h1 id="title">Загрузка…</h1>
  <p id="subtitle">Определяем кабинет.</p>
  <div id="modeSwitch" class="modeSwitch hidden"></div>
  <div id="nav" class="nav hidden"></div>
  <div id="app"></div>
</main>
<div id="modalRoot"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready?.();tg?.expand?.();
const initData=tg?.initData||'';const tgUser=tg?.initDataUnsafe?.user||{};const $=s=>document.querySelector(s);const app=$('#app');
const authHeaders=()=>initData?{'X-Telegram-Init-Data':initData}:{};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...authHeaders()};if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';const r=await fetch(url,opt);if(!r.ok){let d={};try{d=await r.json()}catch{};throw new Error(d.detail||`HTTP ${r.status}`)}return r.status===204?null:r.json()}
const goalNames={ironman:'Триатлон · Ironman 140.6',half_ironman:'Триатлон · 70.3',olympic:'Триатлон · Олимпийская',sprint:'Триатлон · Спринт',running:'Бег',crossfit:'Кроссфит',fat_loss:'Фигура / композиция тела',muscle_gain:'Фигура / композиция тела',strength:'Сила',figure:'Фигура / композиция тела'};
const statusNames={NEW:'Новый',WAITING_APPROVAL:'Ждёт одобрения',ASSESSMENT:'Тестирование',ACTIVE:'Активен',PAYMENT_DUE:'Ожидает оплату',SUSPENDED:'Доступ закрыт',PAUSED:'Пауза',REHAB:'Реабилитация',COMPLETED:'Завершил',ARCHIVE:'Архив'};
const workoutStatusNames={SCHEDULED:'Запланирована',OPENED:'Открыта',COMPLETED:'Выполнена',PARTIAL:'Выполнена частично',NOT_DONE:'Не выполнена'};
const athleteMetricDefs=[['back_squat_1rm','Присед 1ПМ','кг','strength'],['front_squat_1rm','Фронт. присед 1ПМ','кг','strength'],['deadlift_1rm','Становая 1ПМ','кг','strength'],['bench_press_1rm','Жим лёжа 1ПМ','кг','strength'],['overhead_press_1rm','Жим стоя 1ПМ','кг','strength'],['clean_1rm','Взятие 1ПМ','кг','strength'],['snatch_1rm','Рывок 1ПМ','кг','strength'],['bike_ftp','FTP','Вт','bike'],['bike_threshold_hr','АП вело','уд/мин','bike'],['run_threshold_hr','АП бег','уд/мин','run'],['run_threshold_pace_sec_km','Порог темп','сек/км','run']];
const metricGroups={strength:'Силовые показатели',bike:'Триатлон · велосипед',run:'Бег / триатлон · бег'};
function secToPace(v){v=Math.round(+v||0);if(!v)return'';const m=Math.floor(v/60),ss=String(v%60).padStart(2,'0');return `${m}:${ss}`}
function paceToSec(v){const x=String(v||'').trim();if(!x)return null;if(/^\d+(?:\.\d+)?$/.test(x))return +x;const p=x.split(':').map(Number);if(p.length!==2||p.some(Number.isNaN))return null;return p[0]*60+p[1]}
function metricDisplay(m){if(!m)return'—';if(m.metric_type==='run_threshold_pace_sec_km')return `${secToPace(m.value)}/км`;return `${Math.round(m.value*100)/100} ${esc(m.unit||'')}`.trim()}
function metricStrip(snapshot){const b=snapshot?.by_type||{};const order=['back_squat_1rm','deadlift_1rm','bench_press_1rm','overhead_press_1rm','bike_ftp','run_threshold_hr','run_threshold_pace_sec_km'];const pills=order.filter(k=>b[k]).map(k=>{const d=athleteMetricDefs.find(x=>x[0]===k),m=b[k];return `<span class="metricPill ${m.confirmed?'':'pending'}"><b>${esc(d?.[1]||k)}</b> ${metricDisplay(m)}${m.confirmed?'':' · со слов'}</span>`});if(snapshot?.ftp_wkg)pills.push(`<span class="metricPill"><b>FTP/кг</b> ${snapshot.ftp_wkg}</span>`);return pills.length?`<div class="metricStrip">${pills.join('')}</div>`:'<div class="small muted">Ключевые показатели ещё не заполнены.</div>'}
function metricFields(snapshot={},prefix='metric'){const b=snapshot?.by_type||{};let out='';for(const g of ['strength','bike','run']){out+=`<div class="metricGroup">${metricGroups[g]}</div><div class="metricGrid">`;for(const [k,label,unit,group] of athleteMetricDefs.filter(x=>x[3]===g)){const m=b[k],val=k==='run_threshold_pace_sec_km'?(m?secToPace(m.value):''):(m?.value??'');out+=`<div class="metricInput"><label>${label}<input class="athleteMetricField" data-key="${k}" data-unit="${unit}" id="${prefix}_${k}" type="${k==='run_threshold_pace_sec_km'?'text':'number'}" ${k==='run_threshold_pace_sec_km'?'placeholder="4:30"':'step="0.01"'} value="${esc(val)}"></label>${m?`<div class="small muted">${m.confirmed?'Подтверждено тренером':'Со слов клиента'} · ${fmtDate(m.measured_at)}</div>`:''}</div>`}out+='</div>'}return out}
function collectMetricPayload(root=document){const metrics=[];root.querySelectorAll('.athleteMetricField').forEach(x=>{if(!String(x.value||'').trim())return;let v=x.dataset.key==='run_threshold_pace_sec_km'?paceToSec(x.value):+x.value;if(!v||v<=0)return;metrics.push({metric_type:x.dataset.key,value:v,unit:x.dataset.unit,measured_at:appToday()})});return metrics}

let me=null,currentClient=null,activeMode='client',currentRoute='clientHome',ws=null;
function scheduleAppDayRefresh(){const now=Date.now(),local=new Date(now+7*3600000);const nextMidnightUtc=Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate()+1,0,0,1)-7*3600000;setTimeout(()=>{if(activeMode==='client'&&currentRoute==='clientHome')route('clientHome');scheduleAppDayRefresh()},Math.max(1000,nextMidnightUtc-now))}
scheduleAppDayRefresh();
function setHeader(title,sub){$('#title').textContent=title;$('#subtitle').textContent=sub||''}
function nav(items,active){const n=$('#nav');n.classList.remove('hidden');n.innerHTML=items.map(([id,t])=>`<button data-id="${id}" class="${id===active?'active':''}">${t}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>route(b.dataset.id))}
function esc(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fileToImagePayload(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const raw=String(r.result||'');const comma=raw.indexOf(',');if(comma<0)return reject(new Error('Не удалось прочитать '+file.name));resolve({filename:file.name,mime_type:file.type||'image/jpeg',data_base64:raw.slice(comma+1)})};r.onerror=()=>reject(new Error('Не удалось прочитать '+file.name));r.readAsDataURL(file)})}
function fmtDate(s){if(!s)return'—';return String(s).slice(0,10)}
function appToday(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const m={};parts.forEach(p=>m[p.type]=p.value);return `${m.year}-${m.month}-${m.day}`}
function spinner(){app.innerHTML='<div class="panel"><p>Загрузка…</p></div>'}
function errorBox(e){app.innerHTML=`<div class="panel"><h2>Не удалось открыть</h2><p class="error">${esc(e.message)}</p><p>Откройте M17 кнопкой внутри Telegram. Если ошибка повторяется — сообщите тренеру.</p></div>`}
function renderModeSwitch(){const box=$('#modeSwitch');if(!me?.is_coach){box.classList.add('hidden');return}box.classList.remove('hidden');box.innerHTML=`<button data-mode="coach" class="${activeMode==='coach'?'active':''}">M17 Тренер</button><button data-mode="client" class="${activeMode==='client'?'active':''}">Мои тренировки</button>`;box.querySelectorAll('button').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode))}
function switchMode(mode){activeMode=mode;localStorage.setItem('m17Mode',mode);currentClient=null;renderModeSwitch();if(mode==='coach'){setHeader('M17 Тренер','Контроль клиентов, тренировок и доступа');route('coachDashboard')}else{setHeader('M17 Клиент','Мои тренировки');route('clientHome')}}
function connectWs(){if(!initData)return;try{const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?initData=${encodeURIComponent(initData)}`);ws.onopen=()=>{try{ws.send('ready')}catch{}};ws.onmessage=(e)=>{let d={};try{d=JSON.parse(e.data)}catch{};if(['workout_updated','program_updated','access_updated','workout_feedback'].includes(d.type)){tg?.HapticFeedback?.notificationOccurred?.('success');if(activeMode==='client')route(currentRoute||'clientHome');else if(d.type==='workout_feedback'&&activeMode==='coach')route(currentRoute||'coachOverview')}};ws.onclose=()=>setTimeout(connectWs,3000)}catch{}}
async function start(){try{me=await api('/auth/me');activeMode=me.is_coach?(localStorage.getItem('m17Mode')||'coach'):'client';if(!['coach','client'].includes(activeMode))activeMode=me.is_coach?'coach':'client';renderModeSwitch();connectWs();if(activeMode==='coach'&&me.is_coach){setHeader('M17 Тренер','Контроль клиентов, тренировок и доступа');route('coachDashboard')}else{setHeader('M17 Клиент',me.is_coach?'Мои тренировки':'Личный кабинет клиента');route('clientHome')}}catch(e){errorBox(e)}}
function route(name){currentRoute=name;if(activeMode==='coach'&&me?.is_coach){const items=[['coachDashboard','Обзор'],['coachClients','Клиенты'],['coachNew','Новые'],['coachPrograms','Программы'],['coachExercises','Упражнения'],['coachPayments','Оплаты']];nav(items,name);if(name==='coachDashboard')coachDashboard();if(name==='coachClients')coachClients();if(name==='coachNew')coachClients('WAITING_APPROVAL');if(name==='coachPrograms')coachPrograms();if(name==='coachExercises')coachExercises();if(name==='coachPayments')coachPayments()}else{const items=[['clientHome','Сегодня'],['clientArchive','Архив'],['clientVacation','Отпуск'],['clientProgress','Прогресс'],['clientProfile','Профиль']];nav(items,name);if(name==='clientHome')clientHome();if(name==='clientArchive')clientArchive();if(name==='clientVacation')clientVacation();if(name==='clientProgress')clientProgress();if(name==='clientProfile')clientProfile()}}

async function coachDashboard(){spinner();try{const d=await api('/coach/dashboard');app.innerHTML=`<div class=\"stats\"><div class=\"stat\"><b>${d.clients}</b><small>всего клиентов</small></div><div class=\"stat\"><b>${d.active_clients}</b><small>активных</small></div><div class=\"stat\"><b>${d.vacation_count||0}</b><small>сейчас в отпуске</small></div><div class=\"stat\"><b>${d.new_clients}</b><small>новых анкет</small></div><div class=\"stat\"><b>${d.alerts_count}</b><small>требуют внимания</small></div><div class=\"stat\"><b>${d.payments_due_7}</b><small>оплата ≤ 7 дней</small></div></div><div class=\"panel\"><h2>В отпуске</h2>${d.vacation_clients?.length?d.vacation_clients.map(v=>`<div class=\"log clientCard\" data-id=\"${v.client_id}\"><b>✈️ ${esc(v.name)}</b><div class=\"small muted\">${fmtDate(v.start_date)} — ${fmtDate(v.end_date)} · ${vacGymName(v.gym_type)}</div></div>`).join(''):'<p>Сейчас никто не отмечен как находящийся в отпуске.</p>'}</div><div class=\"panel\"><h2>Требуют внимания</h2>${d.alerts.length?d.alerts.map(a=>`<div class=\"log clientCard\" data-id=\"${a.client_id}\"><b>${esc(a.name)}</b><div class=\"alert small\">${esc(a.message)}</div></div>`).join(''):'<p>Сейчас критических сигналов нет.</p>'}</div><div class=\"panel\"><h2>Быстрые действия</h2><button class=\"primary\" onclick=\"route('coachNew')\">Новые анкеты</button><button class=\"secondary\" onclick=\"route('coachPayments')\">Оплаты и доступ</button></div>`;bindClientCards()}catch(e){errorBox(e)}}
async function coachClients(status=''){spinner();try{const rows=await api('/coach/clients'+(status?`?status=${status}`:''));app.innerHTML=`<div class="panel"><div class="row"><h2>${status?'Новые клиенты':'Все клиенты'}</h2><span class="pill">${rows.length}</span></div>${rows.length?rows.map(c=>`<div class="card clientCard" data-id="${c.telegram_user_id}"><div class="row"><div><b>${esc(c.name)}</b><div class="small muted">${(c.goals||[]).map(g=>goalNames[g.goal]||g.goal).join(' · ')} · ${esc(c.level)} · стаж ${c.experience_years} г.</div></div><span class="badge ${c.status}">${statusNames[c.status]||c.status}</span></div><div class="small ${c.access?.allowed?'accessGood':'accessBad'}">Доступ: ${esc(c.access?.state||'—')} · ${esc(c.access?.message||'')}</div>${c.vacation&&c.vacation.state!=='COMPLETED'?`<div class="small warn">✈️ Отпуск: ${fmtDate(c.vacation.start_date)} — ${fmtDate(c.vacation.end_date)} · ${vacGymName(c.vacation.gym_type)}</div>`:''}${metricStrip(c.athlete_metrics)}${c.assessment?.needs_testing?`<div class="small warn">Нужны показатели · после вводного цикла 2 недели тестирования</div>`:''}${c.program?`<div class="small muted">Программа: ${esc(c.program.title)} · ${esc(c.program.phase)}</div>`:'<div class="small muted">Программа ещё не назначена</div>'}${c.alert?`<div class="alert small">${esc(c.alert)}</div>`:''}</div>`).join(''):'<p>Здесь пока пусто.</p>'}</div>`;bindClientCards()}catch(e){errorBox(e)}}
function bindClientCards(){document.querySelectorAll('.clientCard').forEach(x=>x.onclick=()=>coachClient(x.dataset.id))}
function vacGymName(v){return ({NO_EQUIPMENT:'без оборудования',MINIMAL:'минимальное оборудование',PARTIAL_GYM:'неполный зал',FULL_GYM:'полноценный зал'})[v]||v||'—'}

async function coachCycle(id){spinner();try{const [c,clients]=await Promise.all([api(`/coach/library/cycles/${id}`),api('/coach/clients')]);const activeClients=clients.filter(x=>x.status==='ACTIVE');const clientCompatible=x=>c.audience==='all'||x.sex===c.audience;setHeader(c.title,`${c.sport_label} · ${c.level_label}`);$('#nav').classList.add('hidden');const byWeek={};(c.workouts||[]).forEach(w=>(byWeek[w.week_no]??=[]).push(w));const editor=c.can_edit?`<div class="panel"><div class="row"><h2>Редактор моего цикла</h2><span class="tag">только тренер</span></div><div class="formgrid"><label>Название цикла<input id="editCyTitle" value="${esc(c.title)}"></label><label>Направление<select id="editCySport">${opts(librarySports,c.sport)}</select></label><label>Уровень<select id="editCyLevel">${opts(libraryLevels,c.level)}</select></label><label>Для кого<select id="editCyAudience"><option value="all" ${c.audience==='all'?'selected':''}>Для всех</option><option value="male" ${c.audience==='male'?'selected':''}>Мужчины</option><option value="female" ${c.audience==='female'?'selected':''}>Женщины</option></select></label><label>Недель<input id="editCyWeeks" type="number" min="1" max="52" value="${c.duration_weeks}"></label><label>Тренировок/нед<input id="editCySessions" type="number" min="1" max="14" value="${c.sessions_per_week}"></label></div><label>Фаза / задача<input id="editCyPhase" value="${esc(c.phase)}"></label><label>Примечание<textarea id="editCyNotes">${esc(c.notes||'')}</textarea></label><button id="saveCycleMeta" class="primary">Сохранить изменения цикла</button><button id="archiveCycle" class="danger">Убрать цикл в архив</button></div>`:`<div class="panel locked"><b>🔒 Исходный цикл защищён</b><p class="small">Редактор доступен только для циклов, которые внесены вами. Этот цикл можно назначить клиенту, а персональную копию клиента редактировать отдельно.</p></div>`;const workoutCards=Object.keys(byWeek).length?Object.keys(byWeek).sort((a,b)=>+a-+b).map(wn=>`<div class="weekGroup"><h3>Неделя ${wn}</h3>${byWeek[wn].map(w=>`<details class="card"><summary><b>${dayName(w.day_index)} · ${esc(w.title)}</b></summary><div class="pre" style="margin-top:10px">${esc(w.content?.text||'')}</div>${w.stimulus?.text?`<p class="small"><b>Целевой стимул:</b> ${esc(w.stimulus.text)}</p>`:''}${w.load?.rule?`<p class="small"><b>Правило нагрузки:</b> ${esc(w.load.rule)}</p>`:''}<div>${(w.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${c.can_edit?`<button class="secondary editCycleWorkout" data-wid="${w.id}">Редактировать тренировку</button><button class="danger deleteCycleWorkout" data-wid="${w.id}">Удалить из шаблона</button>`:''}</details>`).join('')}</div>`).join(''):'<p>В этом цикле пока нет тренировок.</p>';const addWorkout=c.can_edit?`<div class="panel"><h2>Добавить тренировку в цикл</h2><div class="formgrid"><label>Неделя<input id="cwWeek" type="number" min="1" max="52" value="1"></label><label>День<select id="cwDay">${[['0','ПН'],['1','ВТ'],['2','СР'],['3','ЧТ'],['4','ПТ'],['5','СБ'],['6','ВС']].map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label><label>Название<input id="cwTitle" value="Тренировка"></label></div><label>Содержание<textarea id="cwText" style="min-height:220px" placeholder="Разминка…

se;await api(`/coach/exercises/${encodeURIComponent(code)}`,{method:'PUT',body:JSON.stringify(payload)});tg?.HapticFeedback?.notificationOccurred?.('success');coachExercise(code)};$('#archiveExercise').onclick=async()=>{if(!confirm('Убрать упражнение в архив?'))return;await api(`/coach/exercises/${encodeURIComponent(code)}`,{method:'DELETE'});route('coachExercises')}}catch(e){errorBox(e)}}

function showFeedback(w){

  <label id="fbRpeWrap">ИВН / RPE (1–10)<select id="fbRpe"><option value="">Выберите</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label>
  <label>Самочувствие после тренировки (1–10)<select id="fbWellbeing"><option value="">Выберите</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label>
  <label class="chip"><input id="fbPain" type="checkbox"> Есть боль / дискомфорт</label>
  <label id="fbPainWrap" class="hidden">Где именно?<input id="fbPainLocation" maxlength="300" placeholder="Например: правое колено"></label>
  <label id="fbReasonWrap" class="hidden">Причина / что помешало<input id="fbReason" maxlength="300" placeholder="Например: не успел закончить последний блок"></label>

  <button id="submitFeedback" class="primary">Отправить тренеру и завершить</button><div id="feedbackStatus" class="small muted"></div></div>`;
  document.body.appendChild(modal);

  $('#fbStatus').onchange=sync;$('#fbPain').onchange=()=>$('#fbPainWrap').classList.toggle('hidden',!$('#fbPain').checked);sync();
  $('#closeFeedback').onclick=()=>modal.remove();
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
  $('#submitFeedback').onclick=async()=>{const st=$('#fbStatus').value;const wb=+$('#fbWellbeing').value;const rpe=$('#fbRpe').value?+$('#fbRpe').value:null;if(!wb){alert('Оцените самочувствие от 1 до 10');return}if(st!=='NOT_DONE'&&!rpe){alert('Укажите ИВН / RPE');return}const b=$('#submitFeedback');b.disabled=true;b.textContent='Отправляем…';$('#feedbackStatus').textContent='Сохраняем отчёт и уведомляем тренера…';try{const r=await api(`/client/workouts/${w.id}/feedback`,{method:'POST',body:JSON.stringify({completion_status:st,rpe,wellbeing:wb,pain:$('#fbPain').checked,pain_location:$('#fbPain').checked?($('#fbPainLocation').value||null):null,reason:st==='COMPLETED'?null:($('#fbReason').value||null),comment:$('#fbComment').value||null})});$('#feedbackStatus').innerHTML=`<span class="ok">✓ Отчёт сохранён. Тренировка перенесена в архив.${r.coach_notifications_sent>0?' Тренеру отправлено уведомление.':' Отчёт доступен тренеру в M17.'}</span>`;tg?.HapticFeedback?.notificationOccurred?.('success');setTimeout(()=>{modal.remove();clientArchive()},650)}catch(e){b.disabled=false;b.textContent='Отправить тренеру и завершить';$('#feedbackStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}}

async function clientProgress(){spinner();try{const a=await api('/client/athlete-metrics'),d=await api('/client/home');app.innerHTML=`<div class="panel"><div class="row"><h2>Ключевые показатели</h2><span class="pill">1ПМ · FTP · АП</span></div><p class="small">Если показатель знаете — внесите его. До проверки тренером он будет отмечен как «со слов клиента».</p>${metricFields(a.metrics,'clientMetric')}<button id="saveClientMetrics" class="primary">Сохранить показатели</button>${a.assessment?.needs_testing?`<div class="card testingCard"><b>Показатели определены не полностью</b><p class="small">Для новичка после вводного цикла предусмотрены 2 недели тестирования. Тренер назначит их и подтвердит рабочие значения.</p></div>`:''}</div><div class="panel"><h2>История ключевых показателей</h2>${a.history?.length?a.history.slice(0,50).map(m=>`<div class="log"><b>${esc(m.label)}</b> — ${m.metric_type==='run_threshold_pace_sec_km'?secToPace(m.value)+'/км':`${m.value} ${esc(m.unit||'')}`}<div class="small muted">${fmtDate(m.measured_at)} · ${m.confirmed?'подтверждено тренером':'со слов клиента'}</div></div>`).join(''):'<p>Пока пусто.</p>'}</div><div class="panel"><h2>Другой прогресс</h2><div class="formgrid"><label>Показатель<select id="metricType"><option value="weight">Вес</option><option value="waist">Талия</option><option value="run_5k">Бег 5 км</option><option value="run_10k">Бег 10 км</option><option value="trail">Трейл</option><option value="swim_css">CSS плавание</option></select></label><label>Значение<input id="metricValue" type="number" step="0.01"></label><label>Единица<input id="metricUnit" placeholder="кг, мин, сек/100м…"></label><label>Комментарий<input id="metricNote"></label></div><button id="addMetric" class="secondary">Сохранить другой показатель</button>${d.metrics?.length?d.metrics.map(m=>`<div class="log"><b>${esc(m.metric_type)}</b> — ${m.value} ${esc(m.unit||'')}<div class="small muted">${fmtDate(m.measured_at)}</div></div>`).join(''):''}</div>`;$('#saveClientMetrics').onclick=async()=>{const metrics=collectMetricPayload(app);if(!metrics.length){alert('Заполните хотя бы один показатель');return}await api('/client/athlete-metrics',{method:'PUT',body:JSON.stringify({metrics})});tg?.HapticFeedback?.notificationOccurred?.('success');clientProgress()};$('#addMetric').onclick=async()=>{if(!$('#metricValue').value)return;await api('/client/progress',{method:'POST',body:JSON.stringify({metric_type:$('#metricType').value,value:+$('#metricValue').value,unit:$('#metricUnit').value,note:$('#metricNote').value||null})});clientProgress()}}catch(e){errorBox(e)}}
async function clientProfile(){spinner();try{const d=await api('/client/home');if(!d.has_profile)return showOnboarding();renderProfileForm(d.profile,false,d.athlete_metrics)}catch(e){errorBox(e)}}

const triGoals=['sprint','olympic','half_ironman','ironman'];
const goals=[['running','Бег','Общий бег, 5/10 км, полумарафон, марафон, трейл'],['crossfit','Кроссфит','Функциональная подготовка'],['figure','Фигура','Снижение жировой массы, рекомпозиция, мышечные акценты'],['strength','Сила','Развитие силы']];
const runDistances=[['general','Обычный бег без цели'],['5k','5 км'],['10k','10 км'],['half','Полумарафон'],['marathon','Марафон'],['trail','Трейл']];
const equipment=['Тренажёрный зал','Штанга/стойки','Гири/гантели','Кроссовер','Кроссфит-зал','Бассейн','Велосипед','Велостанок','Беговая дорожка','Байк Эрг (BikeErg)','Гребной тренажёр','Лыжный тренажёр SkiErg','Турник','Кольца','Коробка','Резины'];
const focuses=[['glutes','Ягодичные'],['hamstrings','Задняя поверхность бедра'],['quads','Квадрицепс'],['core','Пресс / корпус'],['back','Спина'],['shoulders','Плечи'],['chest','Грудь'],['arms','Руки'],['calves','Икры']];
const weekDays=[['0','ПН'],['1','ВТ'],['2','СР'],['3','ЧТ'],['4','ПТ'],['5','СБ'],['6','ВС']];
function dayName(i){return ({0:'ПН',1:'ВТ',2:'СР',3:'ЧТ',4:'ПТ',5:'СБ',6:'ВС'})[Number(i)]||String(i)}
function showOnboarding(){setHeader('Новый клиент','Можно выбрать несколько направлений и конкретные дни тренировок');renderProfileForm(null,true)}
function renderProfileForm(p=null,isNew=false,athleteMetrics={}){let gd={...(p?.goal_details||{})};const rawGoals=(p?.goals||[{goal:p?.primary_goal||'running'}]);const legacyFat=rawGoals.some(g=>g.goal==='fat_loss')||p?.primary_goal==='fat_loss';const legacyMuscle=rawGoals.some(g=>g.goal==='muscle_gain')||p?.primary_goal==='muscle_gain';let selected=new Set(rawGoals.map(g=>(g.goal==='fat_loss'||g.goal==='muscle_gain')?'figure':g.goal)),primary=(p?.primary_goal==='fat_loss'||p?.primary_goal==='muscle_gain')?'figure':(p?.primary_goal||'running');if(!gd.figure_goal&&(legacyFat||legacyMuscle))gd.figure_goal=legacyFat&&legacyMuscle?'recomposition':legacyMuscle?'muscle_shape':'fat_loss_shape';let triDistance=triGoals.find(x=>selected.has(x))||gd.triathlon_distance||'sprint';let runDistance=gd.running_distance||'general';let trainingDays=new Set((p?.training_days?.length?p.training_days:[0,2,4]).map(Number));const triSelected=()=>triGoals.some(x=>selected.has(x));function replaceTri(v){const oldTri=triGoals.find(x=>selected.has(x));triGoals.forEach(x=>selected.delete(x));selected.add(v);if(primary===oldTri||triGoals.includes(primary))primary=v;triDistance=v}
app.innerHTML=`<div class="panel"><h2>${isNew?'Анкета нового клиента':'Мой профиль'}</h2><div class="formgrid"><label>Имя<input id="pName" value="${esc(p?.name||tgUser.first_name||'')}"></label><label>Пол<select id="pSex"><option value="not_specified">Не указан</option><option value="male">Мужчина</option><option value="female">Женщина</option><option value="other">Другое</option></select></label><label>Возраст<input id="pAge" type="number" min="14" max="90" value="${p?.age||35}"></label><label>Стаж, лет<input id="pExp" type="number" min="0" max="60" step="0.5" value="${p?.experience_years??0}"></label><label>Рост, см<input id="pHeight" type="number" value="${p?.height_cm||''}"></label><label>Вес, кг<input id="pWeight" type="number" step="0.1" value="${p?.weight_kg||''}"></label><label>История<select id="pClientType"><option value="NEW_CLIENT">Новый клиент</option><option value="EXPERIENCED">Продвинутый / уже тренируется</option><option value="RETURNING">Бывший клиент, возвращается</option></select></label><label>Уровень<select id="pLevel"><option value="beginner">Начинающий</option><option value="intermediate">Средний</option><option value="advanced">Продвинутый</option><option value="competitive">Соревновательный</option></select></label></div><h3 class="sectionTitle">Направления и цели</h3><p class="small">Можно выбрать несколько. Триатлон и бег настраиваются отдельно.</p><div id="goalGrid" class="goalgrid"></div><div id="triBlock" class="card hidden"><h3>Триатлон</h3><label>Дистанция<select id="triDistance"><option value="sprint">Спринт</option><option value="olympic">Олимпийская</option><option value="half_ironman">70.3 / половинка</option><option value="ironman">Ironman 140.6</option></select></label><label>Есть конкретный старт?<select id="triHasEvent"><option value="no">Нет, общая подготовка</option><option value="yes">Да</option></select></label><label id="triDateWrap" class="hidden">Дата старта<input id="triEventDate" type="date" value="${esc(gd.triathlon_event_date||'')}"></label></div><div id="runBlock" class="card hidden"><h3>Бег</h3><label>Направление<select id="runDistance">${runDistances.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label><label>Есть конкретный старт?<select id="runHasEvent"><option value="no">Нет</option><option value="yes">Да, готовлюсь к старту</option></select></label><label id="runDateWrap" class="hidden">Дата старта<input id="runEventDate" type="date" value="${esc(gd.running_event_date||'')}"></label><label id="trailTargetWrap" class="hidden">Дистанция / набор высоты / описание трейла<input id="trailTarget" value="${esc(gd.trail_target||'')}" placeholder="Например: 25 км, +1200 м"></label></div><div id="figureBlock" class="card hidden"><h3>Фигура / композиция тела</h3><div id="figureBranchHint" class="small muted">Ветка подбирается автоматически по полу клиента.</div><label>Основная задача<select id="figureGoal"><option value="fat_loss_shape">Снижение жировой массы + сохранение/рост мышц</option><option value="recomposition">Рекомпозиция: меньше жира, больше мышц</option><option value="muscle_shape">Акцент на набор мышц и пропорции фигуры</option></select></label><p class="small">Выберите мышечные приоритеты ниже. Пол не создаёт отдельный верхний раздел — он автоматически выбирает женскую или мужскую ветку программы.</p></div><label>Главная цель<select id="primaryGoal"></select></label><div id="goalPriority"></div><h3 class="focusTitle">Мышечные акценты</h3><div id="focusChecks" class="checks"></div><h3 class="sectionTitle">В какие дни вы тренируетесь?</h3><div id="dayChecks" class="checks"></div><div id="dayTimes"></div><div class="formgrid"><label>Часов в неделю<input id="pHours" type="number" min="1" max="30" step="0.5" value="${p?.hours_per_week||6}"></label></div><h3 class="sectionTitle">Оборудование</h3><div id="eqChecks" class="checks"></div><h3 class="sectionTitle">Ключевые показатели — если знаете</h3><p class="small">Можно оставить пустыми. Тренер подтвердит значения; для новичка после вводного цикла при необходимости будет 2 недели тестирования.</p>${metricFields(athleteMetrics,"profileMetric")}<label>Текущие показатели / важная история<textarea id="pHistory">${esc(gd.history||'')}</textarea></label><label>Ограничения<textarea id="pLimits">${esc(p?.limitations||'')}</textarea></label><label>Комментарий тренеру<textarea id="pNotes">${esc(p?.notes||'')}</textarea></label><button id="saveProfile" class="primary">${isNew?'Отправить анкету тренеру':'Сохранить изменения'}</button><div id="savePStatus" class="small muted"></div></div>`;
if(p?.sex)$('#pSex').value=p.sex;if(p?.level)$('#pLevel').value=p.level;if(p?.client_type)$('#pClientType').value=p.client_type;function syncFigureBranch(){const h=$('#figureBranchHint');if(!h)return;const sex=$('#pSex').value;h.textContent=sex==='female'?'Женская ветка программы будет выбрана автоматически.':sex==='male'?'Мужская ветка программы будет выбрана автоматически.':'Укажите пол, чтобы M17 автоматически выбрал женскую или мужскую ветку.'}$('#pSex').onchange=syncFigureBranch;syncFigureBranch();
function drawGoals(){const triCard=`<button class="goal ${triSelected()?'selected':''}" data-g="triathlon_group"><b>Триатлон</b><span>Спринт / Олимпийская / 70.3 / Ironman</span></button>`;$('#goalGrid').innerHTML=triCard+goals.map(g=>`<button class="goal ${selected.has(g[0])?'selected':''}" data-g="${g[0]}"><b>${g[1]}</b><span>${g[2]}</span></button>`).join('');document.querySelectorAll('.goal').forEach(b=>b.onclick=()=>{const g=b.dataset.g;if(g==='triathlon_group'){if(triSelected()){const was=triGoals.find(x=>selected.has(x));triGoals.forEach(x=>selected.delete(x));if(primary===was)primary=[...selected][0]||'running'}else replaceTri(triDistance)}else{if(selected.has(g)&&selected.size>1)selected.delete(g);else selected.add(g);if(!selected.has(primary)&&!triGoals.includes(primary))primary=[...selected][0]}drawGoals();drawSportBlocks();drawPrimary();drawPriorities()})}
function drawSportBlocks(){$('#triBlock').classList.toggle('hidden',!triSelected());$('#runBlock').classList.toggle('hidden',!selected.has('running'));$('#figureBlock').classList.toggle('hidden',!selected.has('figure'))}
function drawPrimary(){const s=$('#primaryGoal');s.innerHTML=[...selected].map(g=>`<option value="${g}" ${g===primary?'selected':''}>${goalNames[g]}</option>`).join('');s.onchange=()=>{primary=s.value;drawPriorities()}}
function drawPriorities(){$('#goalPriority').innerHTML=[...selected].map(g=>`<div class="priorityBox"><label>${goalNames[g]}<input class="goalTarget" data-g="${g}" placeholder="Дополнительная цель, если есть" value="${esc((p?.goals||[]).find(x=>x.goal===g||(g==='figure'&&(x.goal==='fat_loss'||x.goal==='muscle_gain')))?.target||'')}"></label><label>Приоритет<select class="goalPrio" data-g="${g}"><option value="1" ${(p?.goals||[]).find(x=>x.goal===g)?.priority===1?'selected':''}>1</option><option value="2" ${!(p?.goals||[]).find(x=>x.goal===g)||(p?.goals||[]).find(x=>x.goal===g)?.priority===2?'selected':''}>2</option><option value="3" ${(p?.goals||[]).find(x=>x.goal===g)?.priority===3?'selected':''}>3</option></select></label></div>`).join('')}
function drawDays(){$('#dayChecks').innerHTML=weekDays.map(([v,n])=>`<label class="chip"><input type="checkbox" value="${v}" ${trainingDays.has(+v)?'checked':''}>${n}</label>`).join('');document.querySelectorAll('#dayChecks input').forEach(x=>x.onchange=()=>{x.checked?trainingDays.add(+x.value):trainingDays.delete(+x.value);if(!trainingDays.size){trainingDays.add(+x.value);x.checked=true}drawDayTimes()});drawDayTimes()}
function drawDayTimes(){$('#dayTimes').innerHTML=`<div class="formgrid">${[...trainingDays].sort().map(i=>`<label>${dayName(i)} · доступно минут<input class="dayTime" data-day="${i}" type="number" min="20" max="300" value="${p?.day_time_min?.[String(i)]||60}"></label>`).join('')}</div>`}
drawGoals();drawSportBlocks();drawPrimary();drawPriorities();drawDays();$('#focusChecks').innerHTML=focuses.map(([v,n])=>`<label class="chip"><input type="checkbox" value="${v}" ${(p?.body_focus||[]).includes(v)?'checked':''}>${n}</label>`).join('');$('#eqChecks').innerHTML=equipment.map(e=>`<label class="chip"><input type="checkbox" value="${e}" ${(p?.equipment||[]).includes(e)?'checked':''}>${e}</label>`).join('');$('#triDistance').value=triDistance;$('#triHasEvent').value=gd.triathlon_has_event?'yes':'no';$('#runDistance').value=runDistance;$('#runHasEvent').value=gd.running_has_event?'yes':'no';if($('#figureGoal'))$('#figureGoal').value=gd.figure_goal||'fat_loss_shape';function syncDates(){$('#triDateWrap').classList.toggle('hidden',$('#triHasEvent').value!=='yes');$('#runDateWrap').classList.toggle('hidden',$('#runHasEvent').value!=='yes');$('#trailTargetWrap').classList.toggle('hidden',$('#runDistance').value!=='trail')}syncDates();$('#triHasEvent').onchange=syncDates;$('#runHasEvent').onchange=syncDates;$('#runDistance').onchange=syncDates;$('#triDistance').onchange=e=>{replaceTri(e.target.value);drawGoals();drawPrimary();drawPriorities()};
$('#saveProfile').onclick=async()=>{if(!selected.size){alert('Выберите хотя бы одно направление');return}const goalsPayload=[...selected].map(g=>({goal:g,priority:+document.querySelector(`.goalPrio[data-g="${g}"]`)?.value||2,event_date:g==='running'&&$('#runHasEvent').value==='yes'?$('#runEventDate').value||null:triGoals.includes(g)&&$('#triHasEvent').value==='yes'?$('#triEventDate').value||null:null,target:document.querySelector(`.goalTarget[data-g="${g}"]`)?.value||null}));const dayTime={};document.querySelectorAll('.dayTime').forEach(x=>dayTime[x.dataset.day]=+x.value||60);const eventDate=primary==='running'&&$('#runHasEvent').value==='yes'?$('#runEventDate').value:triGoals.includes(primary)&&$('#triHasEvent').value==='yes'?$('#triEventDate').value:'';let weeks=null;if(eventDate){const diff=(new Date(eventDate+'T12:00:00')-new Date())/604800000;if(diff>0)weeks=Math.max(1,Math.ceil(diff))}const payload={telegram_user_id:String(tgUser.id||'unknown'),telegram_username:tgUser.username||null,name:$('#pName').value.trim()||tgUser.first_name||'Клиент',sex:$('#pSex').value,age:+$('#pAge').value,height_cm:$('#pHeight').value?+$('#pHeight').value:null,weight_kg:$('#pWeight').value?+$('#pWeight').value:null,experience_years:+$('#pExp').value||0,client_type:$('#pClientType').value,primary_goal:primary,goals:goalsPayload,body_focus:[...document.querySelectorAll('#focusChecks input:checked')].map(x=>x.value),goal_details:{triathlon_distance:triSelected()?$('#triDistance').value:null,triathlon_has_event:triSelected()&&$('#triHasEvent').value==='yes',triathlon_event_date:triSelected()&&$('#triHasEvent').value==='yes'?$('#triEventDate').value||null:null,running_distance:selected.has('running')?$('#runDistance').value:null,running_has_event:selected.has('running')&&$('#runHasEvent').value==='yes',running_event_date:selected.has('running')&&$('#runHasEvent').value==='yes'?$('#runEventDate').value||null:null,trail_target:selected.has('running')&&$('#runDistance').value==='trail'?$('#trailTarget').value||null:null,figure_goal:selected.has('figure')?$('#figureGoal').value:null,history:$('#pHistory').value||null},level:$('#pLevel').value,training_days:[...trainingDays].sort(),day_time_min:dayTime,days_per_week:trainingDays.size,hours_per_week:+$('#pHours').value,weeks_to_event:weeks,equipment:[...document.querySelectorAll('#eqChecks input:checked')].map(x=>x.value),limitations:$('#pLimits').value||null,notes:$('#pNotes').value||null};try{await api('/clients/profile',{method:'POST',body:JSON.stringify(payload)});const initialMetrics=collectMetricPayload(app);if(initialMetrics.length)await api('/client/athlete-metrics',{method:'PUT',body:JSON.stringify({metrics:initialMetrics})});$('#savePStatus').innerHTML='<span class="ok">Анкета сохранена и доступна тренеру.</span>';setTimeout(()=>{activeMode='client';localStorage.setItem('m17Mode','client');renderModeSwitch();setHeader('M17 Клиент','Мои тренировки');route('clientHome')},600)}catch(e){$('#savePStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}}}
start();
</script></body></html>
