<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>M17 Training</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--line:#2b3440;--text:#f4f6f8;--muted:#9ea9b7;--accent:#f1c40f;--ok:#2ecc71;--bad:#ff6b6b;--info:#5dade2;--warn:#f5b041}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:920px;margin:auto;padding:16px 14px 90px}h1{font-size:30px;line-height:1.05;margin:8px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{color:var(--muted);line-height:1.45}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--accent);font-weight:800}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.card{background:var(--panel2);margin:8px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.modeSwitch{display:flex;gap:7px;margin:10px 0 4px}.modeSwitch button{flex:1;padding:11px;border-radius:13px;border:1px solid var(--line);background:#202833;color:var(--text);font-weight:800}.modeSwitch button.active{background:var(--accent);color:#111;border-color:var(--accent)}.nav{display:flex;gap:7px;overflow:auto;padding:8px 0 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:4}.nav button,.pill{white-space:nowrap;background:#202833;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 12px}.nav button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}button{font:inherit;cursor:pointer}.primary,.secondary,.danger,.mini{width:100%;padding:14px;border-radius:13px;font-weight:800;margin-top:10px}.primary{background:var(--accent);color:#111;border:0}.secondary{background:#252e39;color:#fff;border:1px solid #3a4655}.danger{background:#3a1e22;color:#ffb6bd;border:1px solid #5b2b32}.mini{width:auto;padding:8px 10px;margin:0;background:#252e39;color:#fff;border:1px solid #3a4655}label{display:block;color:#cfd6df;font-size:13px;margin:10px 0}input,select,textarea{width:100%;background:#0f141b;color:#fff;border:1px solid #354150;border-radius:12px;padding:12px;margin-top:5px;font:inherit}textarea{min-height:100px;resize:vertical}.formgrid,.goalgrid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goal{background:#1a212b;color:white;border:1px solid #303b49;border-radius:15px;padding:14px;text-align:left}.goal.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.goal span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.checks{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #343f4e;padding:8px 10px;border-radius:999px;font-size:12px}.chip input{width:auto;margin:0 5px 0 0}.stat{background:#10161d;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{display:block;font-size:25px}.stat small{color:var(--muted)}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#26303c}.WAITING_APPROVAL,.NEW{background:#473c13;color:#ffe58a}.ACTIVE{background:#163a29;color:#92f0ba}.ASSESSMENT{background:#17344c;color:#9cd5ff}.PAYMENT_DUE{background:#4a3314;color:#ffd98b}.SUSPENDED{background:#4b2026;color:#ffb4bd}.PAUSED,.ARCHIVE{color:#aeb8c4}.alert{border-left:4px solid var(--bad);padding-left:10px;color:#ffc1c1}.warn{border-left:4px solid var(--warn);padding-left:10px;color:#ffe1aa}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}.clientCard{cursor:pointer}.block{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}.block small{display:block;color:var(--muted);max-width:600px}.programBox{border-left:4px solid var(--accent);padding-left:12px}.ok{color:#8ef0b6}.error{color:#ffaaaa}.sectionTitle{margin-top:22px}.back{background:none;border:0;color:#fff;padding:4px 0 10px}.statusButtons{display:flex;gap:6px;flex-wrap:wrap}.statusButtons button{width:auto;margin:0;padding:8px 10px}.log{border-top:1px solid var(--line);padding:10px 0}.log b{font-size:13px}.kicker{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.workout{border-left:4px solid var(--info)}.workout.done{border-left-color:var(--ok)}.workout.partial{border-left-color:var(--warn)}.locked{text-align:center;padding:22px}.pre{white-space:pre-wrap;line-height:1.55;color:#e8edf3;background:#10161d;border-radius:12px;padding:13px;border:1px solid var(--line)}.priorityBox{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:end}.focusTitle{margin:14px 0 6px}.accessGood{color:#8ef0b6}.accessBad{color:#ffb1b1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}.modalBox{background:#151b23;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px;width:min(720px,100%);max-height:88vh;overflow:auto}.rangeRow{display:flex;align-items:center;gap:10px}.rangeRow input{flex:1}.score{font-size:24px;font-weight:800;min-width:35px;text-align:center}.sep{height:1px;background:var(--line);margin:14px 0}
    @media(max-width:620px){.formgrid,.goalgrid,.stats{grid-template-columns:1fr}h1{font-size:27px}.priorityBox{grid-template-columns:1fr 90px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">M17 TRAINING · v0.5.2</div>
  <h1 id="title">Загрузка…</h1>
  <p id="subtitle">Определяем кабинет.</p>
  <div id="modeSwitch" class="modeSwitch hidden"></div>
  <div id="nav" class="nav hidden"></div>
  <div id="app"></div>
</main>
<div id="modalRoot"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready?.();tg?.expand?.();
const initData=tg?.initData||'';const tgUser=tg?.initDataUnsafe?.user||{};const $=s=>document.querySelector(s);const app=$('#app');
const authHeaders=()=>initData?{'X-Telegram-Init-Data':initData}:{};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...authHeaders()};if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';const r=await fetch(url,opt);if(!r.ok){let d={};try{d=await r.json()}catch{};throw new Error(d.detail||`HTTP ${r.status}`)}return r.status===204?null:r.json()}
const goalNames={ironman:'Триатлон · Ironman 140.6',half_ironman:'Триатлон · 70.3',olympic:'Триатлон · Олимпийская',sprint:'Триатлон · Спринт',running:'Бег',crossfit:'Кроссфит',fat_loss:'Похудение',muscle_gain:'Набор мышечной массы',strength:'Сила'};
const statusNames={NEW:'Новый',WAITING_APPROVAL:'Ждёт одобрения',ASSESSMENT:'Тестирование',ACTIVE:'Активен',PAYMENT_DUE:'Ожидает оплату',SUSPENDED:'Доступ закрыт',PAUSED:'Пауза',REHAB:'Реабилитация',COMPLETED:'Завершил',ARCHIVE:'Архив'};
let me=null,currentClient=null,activeMode='client',currentRoute='clientHome',ws=null;
function setHeader(title,sub){$('#title').textContent=title;$('#subtitle').textContent=sub||''}
function nav(items,active){const n=$('#nav');n.classList.remove('hidden');n.innerHTML=items.map(([id,t])=>`<button data-id="${id}" class="${id===active?'active':''}">${t}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>route(b.dataset.id))}
function esc(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){if(!s)return'—';return String(s).slice(0,10)}
function spinner(){app.innerHTML='<div class="panel"><p>Загрузка…</p></div>'}
function errorBox(e){app.innerHTML=`<div class="panel"><h2>Не удалось открыть</h2><p class="error">${esc(e.message)}</p><p>Откройте M17 кнопкой внутри Telegram. Если ошибка повторяется — сообщите тренеру.</p></div>`}
function renderModeSwitch(){const box=$('#modeSwitch');if(!me?.is_coach){box.classList.add('hidden');return}box.classList.remove('hidden');box.innerHTML=`<button data-mode="coach" class="${activeMode==='coach'?'active':''}">M17 Coach</button><button data-mode="client" class="${activeMode==='client'?'active':''}">Мои тренировки</button>`;box.querySelectorAll('button').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode))}
function switchMode(mode){activeMode=mode;localStorage.setItem('m17Mode',mode);currentClient=null;renderModeSwitch();if(mode==='coach'){setHeader('M17 Coach','Контроль клиентов, тренировок и доступа');route('coachDashboard')}else{setHeader('M17 Athlete','Мои тренировки');route('clientHome')}}
function connectWs(){if(!initData)return;try{const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?initData=${encodeURIComponent(initData)}`);ws.onopen=()=>{try{ws.send('ready')}catch{}};ws.onmessage=(e)=>{let d={};try{d=JSON.parse(e.data)}catch{};if(['workout_updated','program_updated','access_updated'].includes(d.type)){tg?.HapticFeedback?.notificationOccurred?.('success');if(activeMode==='client')route(currentRoute||'clientHome')}};ws.onclose=()=>setTimeout(connectWs,3000)}catch{}}
async function start(){try{me=await api('/auth/me');activeMode=me.is_coach?(localStorage.getItem('m17Mode')||'coach'):'client';if(!['coach','client'].includes(activeMode))activeMode=me.is_coach?'coach':'client';renderModeSwitch();connectWs();if(activeMode==='coach'&&me.is_coach){setHeader('M17 Coach','Контроль клиентов, тренировок и доступа');route('coachDashboard')}else{setHeader('M17 Athlete',me.is_coach?'Мои тренировки':'Личный кабинет клиента');route('clientHome')}}catch(e){errorBox(e)}}
function route(name){currentRoute=name;if(activeMode==='coach'&&me?.is_coach){const items=[['coachDashboard','Обзор'],['coachClients','Клиенты'],['coachNew','Новые'],['coachPayments','Оплаты']];nav(items,name);if(name==='coachDashboard')coachDashboard();if(name==='coachClients')coachClients();if(name==='coachNew')coachClients('WAITING_APPROVAL');if(name==='coachPayments')coachPayments()}else{const items=[['clientHome','Сегодня'],['clientProgram','История'],['clientVacation','Отпуск'],['clientProgress','Прогресс'],['clientProfile','Профиль']];nav(items,name);if(name==='clientHome')clientHome();if(name==='clientProgram')clientProgram();if(name==='clientVacation')clientVacation();if(name==='clientProgress')clientProgress();if(name==='clientProfile')clientProfile()}}

async function coachDashboard(){spinner();try{const d=await api('/coach/dashboard');app.innerHTML=`<div class=\"stats\"><div class=\"stat\"><b>${d.clients}</b><small>всего клиентов</small></div><div class=\"stat\"><b>${d.active_clients}</b><small>активных</small></div><div class=\"stat\"><b>${d.vacation_count||0}</b><small>сейчас в отпуске</small></div><div class=\"stat\"><b>${d.new_clients}</b><small>новых анкет</small></div><div class=\"stat\"><b>${d.alerts_count}</b><small>требуют внимания</small></div><div class=\"stat\"><b>${d.payments_due_7}</b><small>оплата ≤ 7 дней</small></div></div><div class=\"panel\"><h2>В отпуске</h2>${d.vacation_clients?.length?d.vacation_clients.map(v=>`<div class=\"log clientCard\" data-id=\"${v.client_id}\"><b>✈️ ${esc(v.name)}</b><div class=\"small muted\">${fmtDate(v.start_date)} — ${fmtDate(v.end_date)} · ${vacGymName(v.gym_type)}</div></div>`).join(''):'<p>Сейчас никто не отмечен как находящийся в отпуске.</p>'}</div><div class=\"panel\"><h2>Требуют внимания</h2>${d.alerts.length?d.alerts.map(a=>`<div class=\"log clientCard\" data-id=\"${a.client_id}\"><b>${esc(a.name)}</b><div class=\"alert small\">${esc(a.message)}</div></div>`).join(''):'<p>Сейчас критических сигналов нет.</p>'}</div><div class=\"panel\"><h2>Быстрые действия</h2><button class=\"primary\" onclick=\"route('coachNew')\">Новые анкеты</button><button class=\"secondary\" onclick=\"route('coachPayments')\">Оплаты и доступ</button></div>`;bindClientCards()}catch(e){errorBox(e)}}
async function coachClients(status=''){spinner();try{const rows=await api('/coach/clients'+(status?`?status=${status}`:''));app.innerHTML=`<div class="panel"><div class="row"><h2>${status?'Новые клиенты':'Все клиенты'}</h2><span class="pill">${rows.length}</span></div>${rows.length?rows.map(c=>`<div class="card clientCard" data-id="${c.telegram_user_id}"><div class="row"><div><b>${esc(c.name)}</b><div class="small muted">${(c.goals||[]).map(g=>goalNames[g.goal]||g.goal).join(' · ')} · ${esc(c.level)} · стаж ${c.experience_years} г.</div></div><span class="badge ${c.status}">${statusNames[c.status]||c.status}</span></div><div class="small ${c.access?.allowed?'accessGood':'accessBad'}">Доступ: ${esc(c.access?.state||'—')} · ${esc(c.access?.message||'')}</div>${c.vacation&&c.vacation.state!=='COMPLETED'?`<div class="small warn">✈️ Отпуск: ${fmtDate(c.vacation.start_date)} — ${fmtDate(c.vacation.end_date)} · ${vacGymName(c.vacation.gym_type)}</div>`:''}${c.program?`<div class="small muted">Программа: ${esc(c.program.title)} · ${esc(c.program.phase)}</div>`:'<div class="small muted">Программа ещё не назначена</div>'}${c.alert?`<div class="alert small">${esc(c.alert)}</div>`:''}</div>`).join(''):'<p>Здесь пока пусто.</p>'}</div>`;bindClientCards()}catch(e){errorBox(e)}}
function bindClientCards(){document.querySelectorAll('.clientCard').forEach(x=>x.onclick=()=>coachClient(x.dataset.id))}
function vacGymName(v){return ({NO_EQUIPMENT:'без оборудования',MINIMAL:'минимальное оборудование',PARTIAL_GYM:'неполный зал',FULL_GYM:'полноценный зал'})[v]||v||'—'}
function goalList(profile){return (profile.goals||[]).map(g=>`${goalNames[g.goal]||g.goal} · приоритет ${g.priority}${g.target?' · '+esc(g.target):''}`).join('<br>')}
async function coachClient(id){currentClient=id;spinner();try{const d=await api(`/coach/clients/${id}`),p=d.profile,s=d.subscription||{};setHeader(p.name,'Карточка клиента');$('#nav').classList.add('hidden');app.innerHTML=`<button id="backClients" class="back">← К клиентам</button><div class="panel"><div class="row"><div><div class="kicker">${esc(p.client_type)}</div><h2>${esc(p.name)}</h2><div class="small muted">${esc(p.sex)} · ${p.age} лет · ${p.weight_kg||'—'} кг · стаж ${p.experience_years} г.</div></div><span class="badge ${p.status}">${statusNames[p.status]||p.status}</span></div>${d.alert?`<p class="alert">${esc(d.alert)}</p>`:''}<div class="card"><b>Цели</b><div class="small muted">${goalList(p)}</div>${p.body_focus?.length?`<div class="small">Фокус: ${p.body_focus.map(esc).join(', ')}</div>`:''}<div class="small">Дни тренировок: ${(p.training_days||[]).map(dayName).join(', ')||'—'}</div></div>${d.vacation?`<div class="card"><b>✈️ Отпуск · ${esc(d.vacation.state)}</b><div class="small muted">${fmtDate(d.vacation.start_date)} — ${fmtDate(d.vacation.end_date)} · ${vacGymName(d.vacation.gym_type)}</div><div class="small">Оборудование: ${(d.vacation.equipment||[]).map(esc).join(', ')||'нет'}</div>${d.vacation.notes?`<div class="small">${esc(d.vacation.notes)}</div>`:''}</div>`:''}<div class="statusButtons">${['WAITING_APPROVAL','ASSESSMENT','ACTIVE','PAUSED','SUSPENDED','COMPLETED','ARCHIVE'].map(x=>`<button class="secondary statusBtn" data-status="${x}">${statusNames[x]}</button>`).join('')}</div><label>Заметка тренера<textarea id="coachNotes">${esc(p.coach_notes||'')}</textarea></label><button id="saveNotes" class="secondary">Сохранить заметку</button></div>
<div class="panel"><h2>Оплата и доступ</h2><div class="formgrid"><label>Дата начала<input id="subStart" type="date" value="${fmtDate(s.start_date)==='—'?'':fmtDate(s.start_date)}"></label><label>Оплачено до<input id="subPaid" type="date" value="${fmtDate(s.paid_until)==='—'?'':fmtDate(s.paid_until)}"></label><label>Льготный доступ до<input id="subGrace" type="date" value="${fmtDate(s.grace_until)==='—'?'':fmtDate(s.grace_until)}"></label><label>Сумма<input id="subAmount" type="number" step="0.01" value="${s.amount||''}"></label><label>Статус оплаты<select id="subPay"><option>UNPAID</option><option>PAID</option><option>DUE</option><option>REFUNDED</option></select></label><label class="chip"><input id="subAccess" type="checkbox" ${s.access_enabled?'checked':''}> Доступ включён</label></div><p class="small ${d.access.allowed?'accessGood':'accessBad'}">${esc(d.access.state)} · ${esc(d.access.message)}</p><button id="saveSub" class="primary">Сохранить оплату и доступ</button></div>
<div class="panel"><h2>Программа</h2>${d.programs.length?renderPlan(d.programs[0].plan,d.programs[0].title):'<p>Нет активной программы.</p>'}<button id="makeProgram" class="primary">Создать вводный план на 4 недели</button></div>
<div class="panel"><h2>Быстро добавить тренировку</h2><div class="formgrid"><label>Дата<input id="newWDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Название<input id="newWTitle" value="Индивидуальная тренировка"></label></div><label>Содержание<textarea id="newWText" placeholder="Разминка…\nСиловая…\nКондиция…"></textarea></label><button id="addWorkout" class="primary">Добавить клиенту</button></div>
<div class="panel"><h2>Ближайшие тренировки</h2>${d.workouts.length?d.workouts.map(w=>workoutCoachCard(w)).join(''):'<p>Запланированных тренировок нет.</p>'}</div>
<div class="panel"><h2>Последняя обратная связь</h2>${d.feedback.length?d.feedback.slice(0,8).map(f=>`<div class="log"><div class="row"><b>${esc(f.title)}</b><span>${f.completion_status==='COMPLETED'?'✅':f.completion_status==='PARTIAL'?'🟡':'❌'}</span></div><div class="small muted">${fmtDate(f.workout_date)} · RPE ${f.rpe||'—'} · самочувствие ${f.wellbeing}/10 ${f.pain?'· ⚠️ боль':''}</div>${f.comment?`<div class="small">${esc(f.comment)}</div>`:''}</div>`).join(''):'<p>Пока нет отчётов.</p>'}</div>`;
$('#subPay').value=s.payment_status||'UNPAID';$('#backClients').onclick=()=>{setHeader('M17 Coach','Контроль клиентов, тренировок и доступа');route('coachClients')};document.querySelectorAll('.statusBtn').forEach(b=>b.onclick=async()=>{await api(`/coach/clients/${id}/status`,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});coachClient(id)});$('#saveNotes').onclick=async()=>{await api(`/coach/clients/${id}/notes`,{method:'PATCH',body:JSON.stringify({coach_notes:$('#coachNotes').value})});tg?.HapticFeedback?.notificationOccurred?.('success')};$('#saveSub').onclick=async()=>{await api(`/coach/clients/${id}/subscription`,{method:'PATCH',body:JSON.stringify({start_date:$('#subStart').value||null,paid_until:$('#subPaid').value||null,grace_until:$('#subGrace').value||null,amount:$('#subAmount').value?+$('#subAmount').value:null,currency:'RUB',payment_status:$('#subPay').value,access_enabled:$('#subAccess').checked})});coachClient(id)};$('#makeProgram').onclick=async()=>{if(!confirm('Создать вводный план на 4 недели и назначить ежедневные тренировки?'))return;await api(`/coach/clients/${id}/program`,{method:'POST',body:JSON.stringify({activate:true,generate_workouts:true,start_date:$('#subStart').value||new Date().toISOString().slice(0,10)})});coachClient(id)};$('#addWorkout').onclick=async()=>{if(!$('#newWText').value.trim())return;await api(`/coach/clients/${id}/workouts`,{method:'POST',body:JSON.stringify({workout_date:$('#newWDate').value,title:$('#newWTitle').value,text:$('#newWText').value})});coachClient(id)};bindWorkoutEdits(id)}catch(e){errorBox(e)}}
function workoutCoachCard(w){return `<div class="card workout"><div class="row"><div><b>${fmtDate(w.workout_date)} · ${esc(w.title)}</b><div class="small muted">Статус ${esc(w.status)} · версия ${w.version}</div></div><button class="mini editWorkout" data-id="${w.id}">Изменить</button></div><div class="pre">${esc(w.content?.text||'')}</div></div>`}
function bindWorkoutEdits(clientId){document.querySelectorAll('.editWorkout').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const d=await api(`/coach/clients/${clientId}`);const w=d.workouts.find(x=>String(x.id)===String(id));if(!w)return;showEditWorkout(w,clientId)})}
function showEditWorkout(w,clientId){const root=$('#modalRoot');root.innerHTML=`<div class="modal"><div class="modalBox"><div class="row"><h2>Изменить тренировку</h2><button id="closeModal" class="mini">✕</button></div><label>Дата<input id="editWDate" type="date" value="${fmtDate(w.workout_date)}"></label><label>Название<input id="editWTitle" value="${esc(w.title)}"></label><label>Содержание<textarea id="editWText">${esc(w.content?.text||'')}</textarea></label><p class="small muted">Изменение сохранится новой версией и клиент получит уведомление.</p><button id="saveWorkoutEdit" class="primary">Сохранить клиенту</button></div></div>`;$('#closeModal').onclick=()=>root.innerHTML='';$('#saveWorkoutEdit').onclick=async()=>{await api(`/coach/workouts/${w.id}`,{method:'PATCH',body:JSON.stringify({workout_date:$('#editWDate').value,title:$('#editWTitle').value,text:$('#editWText').value})});root.innerHTML='';coachClient(clientId)}}

async function coachPayments(){spinner();try{const d=await api('/coach/payments');app.innerHTML=`<div class="stats"><div class="stat"><b>${d.due_7}</b><small>оплата в 7 дней</small></div><div class="stat"><b>${d.expired}</b><small>доступ истёк</small></div></div><div class="panel"><div class="row"><h2>Оплаты и доступ</h2><button id="sendReminders" class="mini">Напомнить</button></div>${d.items.length?d.items.map(x=>`<div class="card clientCard" data-id="${x.client_id}"><div class="row"><b>${esc(x.name)}</b><span class="badge ${x.access.allowed?'ACTIVE':'SUSPENDED'}">${esc(x.access.state)}</span></div><div class="small muted">Оплачено до: ${fmtDate(x.paid_until)} ${x.days_left!==null?'· '+x.days_left+' дн.':''}</div><div class="small">${esc(x.access.message)}</div></div>`).join(''):'<p>Клиентов пока нет.</p>'}</div>`;bindClientCards();$('#sendReminders').onclick=async()=>{const r=await api('/coach/payments/send-reminders',{method:'POST'});alert(`Отправлено напоминаний: ${r.sent}`)}}catch(e){errorBox(e)}}

function accessPanel(d){if(d.access?.allowed)return `<div class="card"><div class="accessGood"><b>Доступ активен</b></div><div class="small muted">${esc(d.access.message)}</div></div>`;return `<div class="panel locked"><h2>Тренировки пока закрыты</h2><p>${esc(d.access?.message||'Тренер ещё не активировал доступ.')}</p><p class="small">Анкета и история остаются в вашем кабинете. После активации тренировки появятся автоматически.</p></div>`}
async function clientHome(){spinner();try{const d=await api('/client/home');if(!d.has_profile)return showOnboarding();const p=d.profile;if(!d.access?.allowed){app.innerHTML=`${accessPanel(d)}<div class="panel"><h2>Статус анкеты</h2><p>${statusNames[p.status]||p.status}</p></div>`;return}const w=d.current_workout;let workoutHtml='';if(w){if(w.status==='SCHEDULED'){workoutHtml=`<div class="card workout"><div class="row"><div><h2>${esc(w.title)}</h2><div class="small muted">${fmtDate(w.workout_date)}</div></div><span class="badge">ГОТОВА</span></div><p>Содержание откроется только когда вы готовы начать. Следующая тренировка останется заблокированной до вашего отчёта по этой.</p><button id="openWorkout" class="primary">Я готов(а) — открыть тренировку</button></div>`}else{workoutHtml=`<div class="card workout"><div class="row"><div><h2>${esc(w.title)}</h2><div class="small muted">${fmtDate(w.workout_date)} · версия ${w.version}</div></div><span class="badge">ОТКРЫТА</span></div><div class="pre">${esc(w.content?.text||'')}</div><button id="finishWorkout" class="primary">Завершить и дать обратную связь</button></div>`}}else if(d.next_locked){workoutHtml=`<div class="locked"><h2>Следующая тренировка пока закрыта</h2><p>${fmtDate(d.next_locked.workout_date)} · ${esc(d.next_locked.title)}</p><p class="small">Она откроется в день тренировки. Будущие задания заранее не показываются.</p></div>`}else{workoutHtml='<h2>Текущей тренировки нет</h2><p>Тренер назначит следующую тренировку или скорректирует план.</p>'}app.innerHTML=`${accessPanel(d)}${d.vacation?.state==='ACTIVE'?`<div class="card warn"><b>✈️ Вы в отпуске</b><div class="small">${fmtDate(d.vacation.start_date)} — ${fmtDate(d.vacation.end_date)} · ${vacGymName(d.vacation.gym_type)}</div></div>`:''}<div class="panel"><div class="kicker">Текущая тренировка</div>${workoutHtml}<p class="small muted">Осталось тренировок в очереди: ${d.pending_count||0}</p></div>`;if(w&&$('#openWorkout'))$('#openWorkout').onclick=async()=>{awai function showFeedback(w){const root=$('#modalRoot');root.innerHTML=`<div class="modal"><div class="modalBox"><div class="row"><h2>Отчёт после тренировки</h2><button id="closeModal" class="mini">✕</button></div><p>${esc(w.title)}</p><label>Выполнение<select id="fbStatus"><option value="COMPLETED">Выполнил полностью</option><option value="PARTIAL">Выполнил частично</option><option value="NOT_DONE">Не выполнил</option></select></label><label>Насколько тяжело? RPE 1–10<div class="rangeRow"><input id="fbRpe" type="range" min="1" max="10" value="7"><span id="fbRpeScore" class="score">7</span></div></label><label>Самочувствие 1–10<div class="rangeRow"><input id="fbWell" type="range" min="1" max="10" value="7"><span id="fbWellScore" class="score">7</span></div></label><label class="chip"><input id="fbPain" type="checkbox"> Есть боль / дискомфорт</label><label id="painWrap" class="hidden">Где болит?<input id="fbPainLoc"></label><label>Причина, если частично/не выполнено<input id="fbReason" placeholder="Время, тяжело, самочувствие, оборудование…"></label><label>Комментарий<textarea id="fbComment"></textarea></label><button id="sendFeedback" class="primary">Отправить тренеру и закрыть тренировку</button></div></div>`;$('#closeModal').onclick=()=>root.innerHTML='';$('#fbRpe').oninput=e=>$('#fbRpeScore').textContent=e.target.value;$('#fbWell').oninput=e=>$('#fbWellScore').textContent=e.target.value;$('#fbPain').onchange=e=>$('#painWrap').classList.toggle('hidden',!e.target.checked);$('#fbStatus').onchange=e=>document.querySelector('#fbRpe').disabled=e.target.value==='NOT_DONE';$('#sendFeedback').onclick=async()=>{const st=$('#fbStatus').value;await api(`/client/workouts/${w.id}/feedback`,{method:'POST',body:JSON.stringify({completion_status:st,rpe:st==='NOT_DONE'?null:+$('#fbRpe').value,wellbeing:+$('#fbWell').value,pain:$('#fbPain').checked,pain_location:$('#fbPainLoc')?.value||null,reason:$('#fbReason').value||null,comment:$('#fbComment').value||null})});root.innerHTML='';tg?.HapticFeedback?.notificationOccurred?.('success');clientHome()}}

/client/vacation',{method:'DELETE'});clientVacation()}}catch(e){errorBox(e)}}

async function clientProfile(){spinner();try{const d=await api('/client/home');if(!d.has_profile)return showOnboarding();renderProfileForm(d.profile)}catch(e){errorBox(e)}}

const triGoals=['sprint','olympic','half_ironman','ironman'];
const goals=[['running','Бег','Общий бег, 5/10 км, полумарафон, марафон, трейл'],['crossfit','Кроссфит','Функциональная подготовка'],['fat_loss','Похудение','Снижение жировой массы'],['muscle_gain','Набор мышц','Гипертрофия'],['strength','Сила','Развитие силы']];
const runDistances=[['general','Обычный бег без цели'],['5k','5 км'],['10k','10 км'],['half','Полумарафон'],['marathon','Марафон'],['trail','Трейл']];
const equipment=['Тренажёрный зал','Штанга/стойки','Гири/гантели','Кроссфит-зал','Бассейн','Велосипед','Велостанок','Беговая дорожка','Байк Эрг (BikeErg)','Гребной тренажёр','Лыжный тренажёр SkiErg','Турник','Кольца','Коробка','Резины'];
const focuses=[['glutes','Ягодичные'],['core','Пресс / корпус'],['legs','Ноги'],['back','Спина'],['shoulders','Плечи'],['chest','Грудь'],['arms','Руки']];
const weekDays=[['0','ПН'],['1','ВТ'],['2','СР'],['3','ЧТ'],['4','ПТ'],['5','СБ'],['6','ВС']];
function dayName(i){return ({0:'ПН',1:'ВТ',2:'СР',3:'ЧТ',4:'ПТ',5:'СБ',6:'ВС'})[Number(i)]||String(i)}
function showOnboarding(){setHeader('Новый клиент','Можно выбрать несколько направлений и конкретные дни тренировок');renderProfileForm(null,true)}
function renderProfileForm(p=null,isNew=false){let selected=new Set((p?.goals||[{goal:p?.primary_goal||'running'}]).map(g=>g.goal)),primary=p?.primary_goal||'running';let gd=p?.goal_details||{};let triDistance=triGoals.find(x=>selected.has(x))||gd.triathlon_distance||'sprint';let runDistance=gd.running_distance||'general';let trainingDays=new Set((p?.training_days?.length?p.training_days:[0,2,4]).map(Number));const triSelected=()=>triGoals.some(x=>selected.has(x));function replaceTri(v){const oldTri=triGoals.find(x=>selected.has(x));triGoals.forEach(x=>selected.delete(x));selected.add(v);if(primary===oldTri||triGoals.includes(primary))primary=v;triDistance=v}
app.innerHTML=`<div class="panel"><h2>${isNew?'Анкета нового клиента':'Мой профиль'}</h2><div class="formgrid"><label>Имя<input id="pName" value="${esc(p?.name||tgUser.first_name||'')}"></label><label>Пол<select id="pSex"><option value="not_specified">Не указан</option><option value="male">Мужчина</option><option value="female">Женщина</option><option value="other">Другое</option></select></label><label>Возраст<input id="pAge" type="number" min="14" max="90" value="${p?.age||35}"></label><label>Стаж, лет<input id="pExp" type="number" min="0" max="60" step="0.5" value="${p?.experience_years??0}"></label><label>Рост, см<input id="pHeight" type="number" value="${p?.height_cm||''}"></label><label>Вес, кг<input id="pWeight" type="number" step="0.1" value="${p?.weight_kg||''}"></label><label>История<select id="pClientType"><option value="NEW_CLIENT">Новый клиент</option><option value="EXPERIENCED">Продвинутый / уже тренируется</option><option value="RETURNING">Бывший клиент, возвращается</option></select></label><label>Уровень<select id="pLevel"><option value="beginner">Начинающий</option><option value="intermediate">Средний</option><option value="advanced">Продвинутый</option><option value="competitive">Соревновательный</option></select></label></div><h3 class="sectionTitle">Направления и цели</h3><p class="small">Можно выбрать несколько. Триатлон и бег настраиваются отдельно.</p><div id="goalGrid" class="goalgrid"></div><div id="triBlock" class="card hidden"><h3>Триатлон</h3><label>Дистанция<select id="triDistance"><option value="sprint">Спринт</option><option value="olympic">Олимпийская</option><option value="half_ironman">70.3 / половинка</option><option value="ironman">Ironman 140.6</option></select></label><label>Есть конкретный старт?<select id="triHasEvent"><option value="no">Нет, общая подготовка</option><option value="yes">Да</option></select></label><label id="triDateWrap" class="hidden">Дата старта<input id="triEventDate" type="date" value="${esc(gd.triathlon_event_date||'')}"></label></div><div id="runBlock" class="card hidden"><h3>Бег</h3><label>Направление<select id="runDistance">${runDistances.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label><label>Есть конкретный старт?<select id="runHasEvent"><option value="no">Нет</option><option value="yes">Да, готовлюсь к старту</option></select></label><label id="runDateWrap" class="hidden">Дата старта<input id="runEventDate" type="date" value="${esc(gd.running_event_date||'')}"></label><label id="trailTargetWrap" class="hidden">Дистанция / набор высоты / описание трейла<input id="trailTarget" value="${esc(gd.trail_target||'')}" placeholder="Например: 25 км, +1200 м"></label></div><label>Главная цель<select id="primaryGoal"></select></label><div id="goalPriority"></div><h3 class="focusTitle">Мышечные акценты</h3><div id="focusChecks" class="checks"></div><h3 class="sectionTitle">В какие дни вы тренируетесь?</h3><div id="dayChecks" class="checks"></div><div id="dayTimes"></div><div class="formgrid"><label>Часов в неделю<input id="pHours" type="number" min="1" max="30" step="0.5" value="${p?.hours_per_week||6}"></label></div><h3 class="sectionTitle">Оборудование</h3><div id="eqChecks" class="checks"></div><label>Текущие показатели / важная история<textarea id="pHistory">${esc(gd.history||'')}</textarea></label><label>Ограничения<textarea id="pLimits">${esc(p?.limitations||'')}</textarea></label><label>Комментарий тренеру<textarea id="pNotes">${esc(p?.notes||'')}</textarea></label><button id="saveProfile" class="primary">${isNew?'Отправить анкету тренеру':'Сохранить изменения'}</button><div id="savePStatus" class="small muted"></div></div>`;
if(p?.sex)$('#pSex').value=p.sex;if(p?.level)$('#pLevel').value=p.level;if(p?.client_type)$('#pClientType').value=p.client_type;
function drawGoals(){const triCard=`<button class="goal ${triSelected()?'selected':''}" data-g="triathlon_group"><b>Триатлон</b><span>Спринт / Олимпийская / 70.3 / Ironman</span></button>`;$('#goalGrid').innerHTML=triCard+goals.map(g=>`<button class="goal ${selected.has(g[0])?'selected':''}" data-g="${g[0]}"><b>${g[1]}</b><span>${g[2]}</span></button>`).join('');document.querySelectorAll('.goal').forEach(b=>b.onclick=()=>{const g=b.dataset.g;if(g==='triathlon_group'){if(triSelected()){const was=triGoals.find(x=>selected.has(x));triGoals.forEach(x=>selected.delete(x));if(primary===was)primary=[...selected][0]||'running'}else replaceTri(triDistance)}else{if(selected.has(g)&&selected.size>1)selected.delete(g);else selected.add(g);if(!selected.has(primary)&&!triGoals.includes(primary))primary=[...selected][0]}drawGoals();drawSportBlocks();drawPrimary();drawPriorities()})}
function drawSportBlocks(){$('#triBlock').classList.toggle('hidden',!triSelected());$('#runBlock').classList.toggle('hidden',!selected.has('running'))}
function drawPrimary(){const s=$('#primaryGoal');s.innerHTML=[...selected].map(g=>`<option value="${g}" ${g===primary?'selected':''}>${goalNames[g]}</option>`).join('');s.onchange=()=>{primary=s.value;drawPriorities()}}
function drawPriorities(){$('#goalPriority').innerHTML=[...selected].map(g=>`<div class="priorityBox"><label>${goalNames[g]}<input class="goalTarget" data-g="${g}" placeholder="Дополнительная цель, если есть" value="${esc((p?.goals||[]).find(x=>x.goal===g)?.target||'')}"></label><label>Приоритет<select class="goalPrio" data-g="${g}"><option value="1" ${(p?.goals||[]).find(x=>x.goal===g)?.priority===1?'selected':''}>1</option><option value="2" ${!(p?.goals||[]).find(x=>x.goal===g)||(p?.goals||[]).find(x=>x.goal===g)?.priority===2?'selected':''}>2</option><option value="3" ${(p?.goals||[]).find(x=>x.goal===g)?.priority===3?'selected':''}>3</option></select></label></div>`).join('')}
function drawDays(){$('#dayChecks').innerHTML=weekDays.map(([v,n])=>`<label class="chip"><input type="checkbox" value="${v}" ${trainingDays.has(+v)?'checked':''}>${n}</label>`).join('');document.querySelectorAll('#dayChecks input').forEach(x=>x.onchange=()=>{x.checked?trainingDays.add(+x.value):trainingDays.delete(+x.value);if(!trainingDays.size){trainingDays.add(+x.value);x.checked=true}drawDayTimes()});drawDayTimes()}
